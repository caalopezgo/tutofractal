<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casino Floor — 24h Replay</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #0f0d14;
      color: #e7e3f3;
      font: 14px/1.4 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app  {
      display: grid;
      grid-template-rows: 50px 60px 1fr;
      height: 100vh;
    }

    /* ---- Top bar ---- */
    .top {
      display: flex; align-items: center; gap: 12px; padding: 0 16px;
      background: #18141f; border-bottom: 1px solid #2a2540;
    }
    .top h1 { font-size: 14px; margin: 0; font-weight: 700; letter-spacing: 0.2px; }
    .top .meta { color: #8c87a4; font-size: 12px; }
    .top .spacer { flex: 1; }
    .top label {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: #b8b3cc; cursor: pointer; user-select: none;
    }
    .top label input { accent-color: #c89b3c; }
    .top button {
      background: #2a2540; color: #e7e3f3; border: 1px solid #3a3454;
      padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
      cursor: pointer;
    }
    .top button:hover { background: #3a3454; }

    /* ---- Time bar ---- */
    .timebar {
      display: flex; align-items: center; gap: 12px;
      padding: 0 16px; background: #14101c; border-bottom: 1px solid #2a2540;
    }
    .timebar .clock {
      font: 800 22px ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #fbbf24; letter-spacing: 1.5px; min-width: 96px;
    }
    .timebar .clock small {
      display: block; font: 600 10px Inter, sans-serif; color: #8c87a4;
      letter-spacing: 1px; text-transform: uppercase;
    }
    .timebar button.icon {
      background: #2a2540; border: 1px solid #3a3454; color: #e7e3f3;
      width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
      font-size: 14px; font-weight: 800;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .timebar button.icon:hover { background: #3a3454; }
    .timebar button.icon.primary { background: #c89b3c; color: #14101c; border-color: #c89b3c; }
    .timebar .speed { display: inline-flex; gap: 4px; }
    .timebar .speed button {
      background: #2a2540; border: 1px solid #3a3454; color: #b8b3cc;
      padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; cursor: pointer;
    }
    .timebar .speed button.active { background: #c89b3c; color: #14101c; border-color: #c89b3c; }

    .scrub {
      flex: 1; height: 30px; position: relative;
      background: #1c1426; border-radius: 15px; cursor: pointer;
      overflow: hidden;
    }
    .scrub .fill {
      position: absolute; left: 0; top: 0; bottom: 0;
      background: linear-gradient(90deg, rgba(200,155,60,0.5), rgba(251,191,36,0.6));
      pointer-events: none;
    }
    .scrub .hours {
      position: absolute; inset: 0; display: flex; pointer-events: none;
    }
    .scrub .hours span {
      flex: 1; border-right: 1px solid rgba(255,255,255,0.05);
      display: flex; align-items: flex-end; justify-content: center;
      font: 700 9px ui-monospace, monospace; color: rgba(176,167,207,0.55);
      padding-bottom: 2px;
    }
    .scrub .hours span:nth-child(6n) { color: rgba(255,234,200,0.9); }
    .scrub .events {
      position: absolute; inset: 0; pointer-events: none;
    }
    .scrub .events i {
      position: absolute; top: 2px; bottom: 2px; width: 3px;
      background: rgba(200, 155, 60, 0.9); border-radius: 2px;
      box-shadow: 0 0 6px rgba(251, 191, 36, 0.7);
    }
    .scrub .knob {
      position: absolute; top: 50%; transform: translate(-50%, -50%);
      width: 14px; height: 14px; border-radius: 50%; background: #fff;
      box-shadow: 0 0 0 3px rgba(200,155,60,0.4);
      pointer-events: none;
    }

    /* ---- Main area: canvas + HUD ---- */
    .main {
      display: grid;
      grid-template-columns: 1fr 280px;
      min-height: 0;
    }
    .stage {
      position: relative; background: #0f0d14;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    canvas { display: block; cursor: crosshair; }

    /* ---- HUD ---- */
    .hud {
      background: #14101c; border-left: 1px solid #2a2540;
      padding: 14px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 14px;
    }
    .hud h2 {
      margin: 0; font-size: 10px; font-weight: 800; color: #8c87a4;
      text-transform: uppercase; letter-spacing: 1.2px; padding-bottom: 4px;
      border-bottom: 1px solid #2a2540;
    }
    .hud .section { display: flex; flex-direction: column; gap: 6px; }
    .hud .kpi {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 3px 0;
    }
    .hud .kpi .label { color: #b8b3cc; font-size: 12px; }
    .hud .kpi .val {
      font: 800 18px ui-monospace, SFMono-Regular, Menlo, monospace; color: #fbbf24;
    }
    .hud .kpi .val.sub { color: #b8b3cc; font-weight: 700; font-size: 12px; }
    .hud .zone {
      display: grid; grid-template-columns: 60px 1fr 44px;
      align-items: center; gap: 8px; font-size: 11px; padding: 3px 0;
    }
    .hud .zone .lbl { color: #b8b3cc; font-weight: 600; }
    .hud .zone .bar {
      height: 8px; background: #1c1426; border-radius: 4px; overflow: hidden;
    }
    .hud .zone .bar .fill {
      height: 100%; background: linear-gradient(90deg, #6c5ce7, #a78bfa);
      transition: width 0.25s ease;
    }
    .hud .zone[data-z="HL"] .bar .fill {
      background: linear-gradient(90deg, #c89b3c, #fbbf24);
    }
    .hud .zone .pct { text-align: right; color: #b8b3cc; font: 700 11px ui-monospace, monospace; }

    .hud .bank-row {
      display: grid; grid-template-columns: 1fr auto;
      align-items: center; gap: 8px; font-size: 11px; padding: 4px 0;
      border-top: 1px dashed rgba(108,92,231,0.15);
    }
    .hud .bank-row:first-of-type { border-top: 0; }
    .hud .bank-row .id { font: 800 11px ui-monospace, monospace; color: #a78bfa; }
    .hud .bank-row .lbl { color: #b8b3cc; font-size: 11px; }
    .hud .bank-row .occ { color: #fbbf24; font: 700 11px ui-monospace, monospace; }

    .hud .event {
      font-size: 11px; padding: 6px 8px; border-radius: 6px;
      background: rgba(200, 155, 60, 0.05); border: 1px solid rgba(200, 155, 60, 0.2);
      display: flex; gap: 8px; align-items: baseline;
      transition: background 0.3s, border-color 0.3s;
    }
    .hud .event.live {
      background: rgba(200, 155, 60, 0.18);
      border-color: rgba(251, 191, 36, 0.7);
      box-shadow: 0 0 14px rgba(251, 191, 36, 0.25);
    }
    .hud .event.past { opacity: 0.45; }
    .hud .event time {
      font: 800 10px ui-monospace, monospace; color: #fbbf24;
      min-width: 38px;
    }
    .hud .event .desc { color: #d8d4ea; line-height: 1.3; }

    /* ---- Tooltip ---- */
    .tooltip {
      position: absolute; pointer-events: none;
      background: rgba(24, 20, 31, 0.96); border: 1px solid #2a2540;
      border-radius: 8px; padding: 7px 10px; font-size: 12px; line-height: 1.45;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
      transform: translate(-50%, calc(-100% - 12px));
      white-space: nowrap; opacity: 0; transition: opacity 0.1s;
      z-index: 5;
    }
    .tooltip.is-on { opacity: 1; }
    .tooltip b { color: #c89b3c; }
    .tooltip code {
      color: #a78bfa; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="app">

    <header class="top">
      <h1>Casino Floor — 24h Replay</h1>
      <span class="meta" id="meta">0 machines</span>
      <span class="spacer"></span>
      <label><input type="checkbox" id="showIds" /> Show IDs</label>

      </div>

          <span>0</span><span></span><span></span><span></span><span></span><span></span>

          <span>12</span><span></span><span></span><span></span><span></span><span></span>

        <div class="section">
          <h2>Events today</h2>

    </div>
  </div>

  <script>
  (function () {
    'use strict';

    // ====================================================================
    // World / static plan
    // ====================================================================
    const W = 1400;
    const H = 900;
    const WALL = 36;

    const ROOMS = [
      { label: 'Cashier Cage', x:  60, y:  56, w: 240, h: 86, kind: 'service' },
      { label: 'Player Club',  x: 320, y:  56, w: 170, h: 86, kind: 'service' },
      { label: 'Coffee',       x: 740, y:  56, w: 130, h: 86, kind: 'service' },
      { label: 'Restrooms',    x: 890, y:  56, w: 120, h: 86, kind: 'wc' },
      { label: 'ATM',          x:1030, y:  56, w:  90, h: 86, kind: 'service' },
      { label: 'VIP Reception',x:1140, y:  56, w: 190, h: 86, kind: 'vip' },
      { label: 'Four Cornered Steakhouse', x:  60, y: 770, w: 270, h: 86, kind: 'dining' },
      { label: 'Bar & Lounge',             x: 350, y: 770, w: 200, h: 86, kind: 'hospitality' },
      { label: 'Casual Dining',            x: 570, y: 770, w: 240, h: 86, kind: 'dining' },
      { label: 'Restrooms',                x: 830, y: 770, w: 120, h: 86, kind: 'wc' },
      { label: 'Emergency Exit',           x: 970, y: 770, w: 360, h: 86, kind: 'exit' },
    ];
    const ENTRANCE = { x0: 560, x1: 720 };
    const ENTRY_POINT = { x: 640, y: 60 };

    const HL_ROOM = { x: 1180, y: 170, w: 150, h: 580, label: 'HIGH LIMIT' };
    const HL_DOOR = { x: 1180, y: 460 };
    const PIT = { x: 80, y: 520, w: 400, h: 230, label: 'TABLE GAMES PIT' };
    const CROSSROADS = { cx: 700, cy: 460, r: 78, label: 'CROSSROADS' };
    const CROSSROADS_AVOID = CROSSROADS.r + 14;

    const AISLES = [
      { x1:  60, y1: 180, x2: 1170, y2: 740 },
      { x1: 1170, y1: 180, x2:  60, y2: 740 },
    ];

    const BANKS = [
      { id: 'C-01', label: 'Buffalo Country',  kind: 'carousel', cx: 320, cy: 280, r: 56, count: 8, zone: 'N' },
      { id: 'L-01', label: 'Lightning Link',   kind: 'linear',   cx: 610, cy: 250, cols: 5, rows: 2, sx: 38, sy: 38, angle: 0,    zone: 'N' },
      { id: 'C-02', label: '88 Fortunes',      kind: 'carousel', cx: 900, cy: 280, r: 56, count: 8, zone: 'N' },
      { id: 'L-02', label: 'Cash Express',     kind: 'linear',   cx: 1080,cy: 270, cols: 3, rows: 2, sx: 38, sy: 38, angle: 0.22, zone: 'N' },
      { id: 'L-03', label: 'Wheel of Fortune', kind: 'linear',   cx: 1000,cy: 460, cols: 4, rows: 2, sx: 38, sy: 38, angle: 0,    zone: 'E' },
      { id: 'L-04', label: 'Megabucks',        kind: 'linear',   cx: 1000,cy: 600, cols: 4, rows: 2, sx: 38, sy: 38, angle: 0.18, zone: 'E' },
      { id: 'L-05', label: 'Penny Park',       kind: 'linear',   cx: 640, cy: 620, cols: 6, rows: 1, sx: 38, sy: 0,  angle: 0,    zone: 'S' },
      { id: 'L-06', label: 'Mystery Cash',     kind: 'linear',   cx: 640, cy: 680, cols: 6, rows: 1, sx: 38, sy: 0,  angle: 0,    zone: 'S' },
      { id: 'C-03', label: 'Dragon Link',      kind: 'carousel', cx: 880, cy: 650, r: 48, count: 7, zone: 'S' },
      { id: 'L-07', label: 'Classic Reels',    kind: 'linear',   cx: 200, cy: 280, cols: 3, rows: 2, sx: 38, sy: 38, angle: 0,    zone: 'W' },
      { id: 'L-08', label: 'Hollywood Hits',   kind: 'linear',   cx: 200, cy: 430, cols: 3, rows: 2, sx: 38, sy: 38, angle:-0.22, zone: 'W' },
      { id: 'C-04', label: 'Video Poker',      kind: 'carousel', cx: 480, cy: 410, r: 50, count: 7, zone: 'W' },
      { id: 'HL-01',label: 'HL Salon',         kind: 'linear',   cx: 1235,cy: 330, cols: 1, rows: 4, sx: 0,  sy: 52, angle: 0, zone: 'HL', hl: true },
      { id: 'HL-02',label: 'HL Plus',          kind: 'linear',   cx: 1290,cy: 330, cols: 1, rows: 4, sx: 0,  sy: 52, angle: 0, zone: 'HL', hl: true },
      { id: 'HL-03',label: 'Whale Lounge',     kind: 'linear',   cx: 1260,cy: 600, cols: 2, rows: 2, sx: 50, sy: 56, angle: 0, zone: 'HL', hl: true },
    ];
    const BANK_MAP = Object.fromEntries(BANKS.map(b => [b.id, b]));

    // Bank weights for player preference (carousels & branded banks attract more)
    const BANK_WEIGHTS = Object.fromEntries(BANKS.map(b => {
      let w = 1.0;
      if (b.kind === 'carousel') w = 1.4;
      if (b.id === 'L-01') w = 1.5;  // Lightning Link is hot
      if (b.id === 'L-03') w = 1.25; // Wheel of Fortune
      if (b.id === 'L-05') w = 1.1;  // Penny Park (cheap entry)
      if (b.hl) w = 0.18;            // HL is rare
      return [b.id, w];
    }));

    // ====================================================================
    // Build machines from bank definitions (with optional angle)
    // ====================================================================
    const machines = [];
    function pushMachine(bank, mx, my) {
      machines.push({
        id: 'EGM-' + String(1000 + machines.length).padStart(4, '0'),
        bank: bank.id,
        bankLabel: bank.label,
        zone: bank.zone,
        x: Math.round(mx),
        y: Math.round(my),
        hl: !!bank.hl,
      });
    }
    BANKS.forEach((b) => {
      if (b.kind === 'linear') {
        const cosA = Math.cos(b.angle || 0), sinA = Math.sin(b.angle || 0);
        for (let r = 0; r < b.rows; r++) {
          for (let c = 0; c < b.cols; c++) {
            const lx = (c - (b.cols - 1) / 2) * b.sx;
            const ly = (r - (b.rows - 1) / 2) * b.sy;
            pushMachine(b, b.cx + lx*cosA - ly*sinA, b.cy + lx*sinA + ly*cosA);
          }
        }
      } else {
        for (let i = 0; i < b.count; i++) {
          const ang = (i / b.count) * Math.PI*2 - Math.PI/2;
          pushMachine(b, b.cx + b.r*Math.cos(ang), b.cy + b.r*Math.sin(ang));
        }
      }
    });
    const machinesByBank = {};
    machines.forEach(m => (machinesByBank[m.bank] = machinesByBank[m.bank] || []).push(m));
    document.getElementById('meta').textContent =
      machines.length + ' machines · ' + BANKS.length + ' banks';

    // ====================================================================
    // Deterministic PRNG so the day is reproducible
    // ====================================================================
    function mulberry32(seed) {
      return function () {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    const rng = mulberry32(20260521);
    const rand = () => rng();
    const randRange = (a, b) => a + rand() * (b - a);
    const randInt = (a, b) => a + Math.floor(rand() * (b - a + 1));
    const pickWeighted = (entries) => {
      let total = 0;
      for (const [, w] of entries) total += w;
      let r = rand() * total;
      for (const [v, w] of entries) { r -= w; if (r <= 0) return v; }
      return entries[entries.length-1][0];
    };

    // ====================================================================
    // Path building — avoid the Crossroads bar, route through HL door
    // ====================================================================
    function avoidCircle(p1, p2, cx, cy, R) {
      // Quick AABB rejection
      const minX = Math.min(p1.x, p2.x) - R, maxX = Math.max(p1.x, p2.x) + R;
      const minY = Math.min(p1.y, p2.y) - R, maxY = Math.max(p1.y, p2.y) + R;
      if (cx < minX || cx > maxX || cy < minY || cy > maxY) return null;
      // Project center onto segment, check distance
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len2 = dx*dx + dy*dy;
      if (len2 < 1e-3) return null;
      const t = ((cx - p1.x) * dx + (cy - p1.y) * dy) / len2;
      if (t <= 0 || t >= 1) return null;
      const px = p1.x + t*dx, py = p1.y + t*dy;
      const d = Math.hypot(px - cx, py - cy);
      if (d >= R) return null;
      // Offset midpoint perpendicular to segment, on the side away from center
      const len = Math.sqrt(len2);
      const nx = -dy / len, ny = dx / len;
      const sign = ((p1.x - cx) * nx + (p1.y - cy) * ny) > 0 ? 1 : -1;
      const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
      return { x: mx + nx * sign * R, y: my + ny * sign * R };
    }
    function buildPath(origin, dest) {
      const points = [origin];
      let from = origin, to = dest;
      // HL door handling: any crossing of x=1180 with one side in HL room
      const inHL = (p) => p.x > HL_ROOM.x;
      if (inHL(origin) !== inHL(dest)) {
        points.push({ x: HL_DOOR.x, y: HL_DOOR.y });
        from = HL_DOOR;
      }
      // Crossroads avoidance
      const mid = avoidCircle(from, dest, CROSSROADS.cx, CROSSROADS.cy, CROSSROADS_AVOID);
      if (mid) points.push(mid);
      points.push(dest);
      // Path length cache for interpolation
      let total = 0;
      const segs = [];
      for (let i = 1; i < points.length; i++) {
        const seg = Math.hypot(points[i].x - points[i-1].x, points[i].y - points[i-1].y);
        total += seg;
        segs.push(seg);
      }
      return { points, segs, total };
    }
    function positionOnPath(path, frac) {
      if (!path.total) return path.points[0];
      const target = path.total * Math.max(0, Math.min(1, frac));
      let acc = 0;
      for (let i = 0; i < path.segs.length; i++) {
        if (acc + path.segs[i] >= target) {
          const t = (target - acc) / path.segs[i];
          const a = path.points[i], b = path.points[i+1];
          return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
        }
        acc += path.segs[i];
      }
      return path.points[path.points.length-1];
    }

    // ====================================================================
    // Day generation — synthetic but reproducible
    // ====================================================================
    // Hourly arrival weights (rough U.S. casino pattern: light morning, peak evening)
    const ARRIVAL_CURVE = [
      3, 2, 1, 1, 1, 2,    // 00..05
      4, 8, 12, 14, 16, 18, // 06..11
      22, 24, 22, 24, 30, 38, // 12..17
      48, 56, 60, 54, 38, 18  // 18..23
    ];
    const CURVE_SUM = ARRIVAL_CURVE.reduce((a, b) => a + b, 0);
    function sampleArrival() {
      let r = rand() * CURVE_SUM;
      for (let h = 0; h < 24; h++) {
        r -= ARRIVAL_CURVE[h];
        if (r <= 0) return h + rand();
      }
      return 23.99;
    }

    const PARTY_COLORS = [
      '#fbbf24', '#a78bfa', '#60a5fa', '#f472b6', '#34d399',
      '#fb923c', '#22d3ee', '#facc15', '#e879f9', '#f87171',
      '#c4b5fd', '#86efac', '#fda4af', '#fcd34d', '#7dd3fc',
    ];

    function pickBankWeighted() {
      return pickWeighted(BANKS.map(b => [b, BANK_WEIGHTS[b.id]]));
    }
    function pickFreeMachineInBank(bankId) {
      const pool = machinesByBank[bankId];
      if (!pool || pool.length === 0) return null;
      // Visual overlap is acceptable; we don't strictly enforce one-player-per-machine
      // because keeping a perfect occupancy schedule across non-chronological spawns is fragile.
      return pool[Math.floor(rand() * pool.length)];
    }

    const WALK_SPEED = 220; // logical units / hour-of-real-time mapping... actually we set in hours: see below
    // Walking time: distance (px) -> hours. Use ~9 px/sec walking speed equivalent.
    // At 10× sim speed, 1 sim hour = 6 min real. So 9 px/sec real * 6 min = 3240 px/sim-hour at 10×.
    // We just convert distance directly using a "pace": minutes per 100 px.
    const WALK_MIN_PER_100PX = 0.55;

    function legWalkHours(dist) { return Math.max(0.02, dist * WALK_MIN_PER_100PX / 100 / 60); }

    const players = [];
    const events = [];           // { at_h, kind, machine, label }
    const TOTAL_PLAYERS = 750;

    function spawnPlayer(idx, opts) {
      opts = opts || {};
      const arrive = opts.arrive_h != null ? opts.arrive_h : sampleArrival();
      const numLegs = opts.numLegs != null ? opts.numLegs : randInt(1, 5);
      const color = PARTY_COLORS[idx % PARTY_COLORS.length];
      const legs = [];
      let cursorPos = { ...ENTRY_POINT };
      let cursor_h = arrive;

      for (let i = 0; i < numLegs && cursor_h < 24; i++) {
        // Pick bank (prefer continuing in same area for some players)
        let bank;
        if (opts.fixedBankId) {
          bank = BANK_MAP[opts.fixedBankId];
        } else if (legs.length > 0 && rand() < 0.35) {
          // Stay in zone (use the previously committed leg, not i-1 which may have been skipped)
          const prev = legs[legs.length - 1];
          const sameZone = BANKS.filter(b => b.zone === prev.machine.zone && !b.hl);
          bank = sameZone.length ? sameZone[Math.floor(rand() * sameZone.length)] : pickBankWeighted();
        } else {
          bank = pickBankWeighted();
        }

        const machine = pickFreeMachineInBank(bank.id);
        if (!machine) continue;

        const path = buildPath(cursorPos, { x: machine.x, y: machine.y });
        const walk_h = legWalkHours(path.total);
        const startWalk = cursor_h;
        const startSit = cursor_h + walk_h;
        // Sit duration: HL plays longer, carousels shorter
        let baseMin = 14;
        if (bank.kind === 'carousel') baseMin = 9;
        if (bank.hl) baseMin = 30;
        const sit_h = (baseMin + rand() * baseMin) / 60;
        const endSit = startSit + sit_h;

        // Wins: per-leg probability
        let win = null;
        const r = rand();
        if (r < 0.06) {
          const big = rand() < 0.05;
          win = {
            at_h: startSit + (endSit - startSit) * (0.2 + rand() * 0.7),
            size: big ? 'big' : 'small',
          };
        }

        legs.push({
          origin: { ...cursorPos },
          machine,
          path,
          startWalk_h: startWalk,
          startSit_h: startSit,
          endSit_h: endSit,
          win,
        });

        cursorPos = { x: machine.x, y: machine.y };
        cursor_h = endSit;
      }

      // Exit leg back to entry/exit
      const exitDest = { ...ENTRY_POINT };
      const exitPath = buildPath(cursorPos, exitDest);
      const exitWalk_h = legWalkHours(exitPath.total);
      const exit_h = cursor_h + exitWalk_h;
      legs.push({
        origin: { ...cursorPos },
        machine: null,
        path: exitPath,
        startWalk_h: cursor_h,
        startSit_h: exit_h,    // arrival at exit; no sitting
        endSit_h: exit_h,
        win: null,
        isExit: true,
      });

      players.push({
        id: opts.idPrefix ? opts.idPrefix + idx : 'P-' + String(1000 + idx).padStart(4, '0'),
        color,
        arrive_h: arrive,
        exit_h,
        legs,
        tag: opts.tag || null,
      });
    }

    // 1) Regular daily traffic
    for (let i = 0; i < TOTAL_PLAYERS; i++) spawnPlayer(i);

    // 2) EVENT — Mini-jackpot at 19:30 on Buffalo Country (C-01)
    {
      const t_jackpot = 19 + 30/60;
      const target = machinesByBank['C-01'][3] || machinesByBank['C-01'][0];
      events.push({
        at_h: t_jackpot,
        kind: 'jackpot',
        machine: target,
        bankId: 'C-01',
        label: 'Mini-jackpot @ Buffalo Country',
      });
      // Spawn 10 "spectator" sessions clustering around C-01 starting just before
      for (let k = 0; k < 10; k++) {
        spawnPlayer(TOTAL_PLAYERS + k, {
          arrive_h: t_jackpot - 0.12 - rand() * 0.05,
          fixedBankId: 'C-01',
          numLegs: 1,
          tag: 'event',
          idPrefix: 'JP-',
        });
      }
    }

    // 3) EVENT — HL Tournament 22:00-23:00 (12 players)
    {
      const t_start = 22;
      const t_end = 23;
      events.push({
        at_h: t_start,
        kind: 'tournament',
        bankId: 'HL-01',
        label: 'High-Limit Tournament',
      });
      const hlMachines = machines.filter(m => m.hl);
      for (let k = 0; k < Math.min(12, hlMachines.length); k++) {
        const m = hlMachines[k];
        const arrive = t_start - 0.08;
        const path = buildPath(ENTRY_POINT, { x: m.x, y: m.y });
        const walk_h = legWalkHours(path.total);
        const exitPath = buildPath({ x: m.x, y: m.y }, ENTRY_POINT);
        const exitWalk_h = legWalkHours(exitPath.total);
        const win = rand() < 0.4 ? { at_h: t_start + 0.4 + rand()*0.4, size: rand() < 0.3 ? 'big' : 'small' } : null;
        players.push({
          id: 'HLT-' + String(k+1).padStart(2,'0'),
          color: '#fde047',
          arrive_h: arrive,
          exit_h: t_end + exitWalk_h,
          tag: 'tournament',
          legs: [
            {
              origin: { ...ENTRY_POINT },
              machine: m,
              path,
              startWalk_h: arrive,
              startSit_h: arrive + walk_h,
              endSit_h: t_end,
              win,
            },
            {
              origin: { x: m.x, y: m.y },
              machine: null,
              path: exitPath,
              startWalk_h: t_end,
              startSit_h: t_end + exitWalk_h,
              endSit_h: t_end + exitWalk_h,
              win: null,
              isExit: true,
            },
          ],
        });
      }
    }

    // Sort players by arrive_h for slightly faster scanning
    players.sort((a, b) => a.arrive_h - b.arrive_h);

    // Build aggregate stats for HUD
    const ZONES = ['N', 'E', 'S', 'W', 'HL'];
    const ZONE_LABEL = { N: 'North', E: 'East', S: 'South', W: 'West', HL: 'High Lim.' };
    const zoneMachineCounts = Object.fromEntries(ZONES.map(z => [z, machines.filter(m => m.zone === z).length]));

    // ====================================================================
    // Canvas + sizing
    // ====================================================================
    const canvas  = document.getElementById('canvas');
    const ctx     = canvas.getContext('2d');
    const stage   = document.getElementById('stage');
    const tooltip = document.getElementById('tooltip');

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const sw = stage.clientWidth, sh = stage.clientHeight;
      const tr = W / H, sr = sw / sh;
      let cw, ch;
      if (sr > tr) { ch = sh; cw = ch * tr; }
      else         { cw = sw; ch = cw / tr; }
      canvas.style.width  = cw + 'px';
      canvas.style.height = ch + 'px';
      canvas.width  = Math.round(cw * dpr);
      canvas.height = Math.round(ch * dpr);
      ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    }
    window.addEventListener('resize', resize);

    // ====================================================================
    // Time controller
    // ====================================================================
    const time = {
      // Sim time as hours [0, 24)
      sim_h: 6.0,                       // start at 6am
      // speed: simulated SECONDS per real SECOND
      speed: 600,
      playing: true,
      lastTs: 0,
    };
    function setSpeed(s) {
      time.speed = s;
      document.querySelectorAll('#speedGroup button').forEach(b => {
        b.classList.toggle('active', +b.dataset.speed === s);
      });
    }
    function setPlaying(p) {
      time.playing = p;
      document.getElementById('playBtn').textContent = p ? '⏸' : '▶';
    }

    document.getElementById('playBtn').addEventListener('click', () => setPlaying(!time.playing));
    document.getElementById('rewindBtn').addEventListener('click', () => { time.sim_h = 0; });
    document.querySelectorAll('#speedGroup button').forEach(b => {
      b.addEventListener('click', () => setSpeed(+b.dataset.speed));
    });

    // Scrub interactions
    const scrub = document.getElementById('scrub');
    let scrubbing = false;
    function scrubFromEvent(e) {
      const r = scrub.getBoundingClientRect();
      const x = Math.max(0, Math.min(r.width, (e.touches ? e.touches[0].clientX : e.clientX) - r.left));
      time.sim_h = (x / r.width) * 24;
    }
    scrub.addEventListener('mousedown', (e) => { scrubbing = true; scrubFromEvent(e); });
    window.addEventListener('mousemove', (e) => { if (scrubbing) scrubFromEvent(e); });
    window.addEventListener('mouseup',   () => { scrubbing = false; });

    // Event markers on scrub
    const scrubEvents = document.getElementById('scrubEvents');
    events.forEach(ev => {
      const i = document.createElement('i');
      i.style.left = ((ev.at_h / 24) * 100) + '%';
      i.title = ev.label;
      scrubEvents.appendChild(i);
    });

    // ====================================================================
    // UI state
    // ====================================================================
    const ui = {
      showIds: false,
      showPaths: true,
      hover: null,
    };
    document.getElementById('showIds').addEventListener('change', (e) => { ui.showIds = e.target.checked; });
    document.getElementById('showPaths').addEventListener('change', (e) => { ui.showPaths = e.target.checked; });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      const payload = JSON.stringify(
        machines.map(m => ({ id: m.id, bank: m.bank, x: m.x, y: m.y, hl: m.hl })),
        null, 2);
      try {
        await navigator.clipboard.writeText(payload);
        const btn = document.getElementById('copyBtn');
        const old = btn.textContent;
        btn.textContent = 'Copied ✓';
        setTimeout(() => (btn.textContent = old), 1200);
      } catch (e) {
        console.log(payload);
        alert('Clipboard blocked — JSON dumped to console.');
      }
    });

    // ====================================================================
    // Drawing helpers — STATIC FLOOR
    // ====================================================================
    function roundRect(c, x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      c.beginPath();
      c.moveTo(x + rr, y);
      c.arcTo(x + w, y,     x + w, y + h, rr);
      c.arcTo(x + w, y + h, x,     y + h, rr);
      c.arcTo(x,     y + h, x,     y,     rr);
      c.arcTo(x,     y,     x + w, y,     rr);
      c.closePath();
    }
    function drawAisles() {
      const stripeWidth = 64;
      ctx.fillStyle = 'rgba(255, 240, 220, 0.05)';
      for (const a of AISLES) {
        const dx = a.x2 - a.x1, dy = a.y2 - a.y1;
        const len = Math.hypot(dx, dy);
        const nx = -dy / len, ny = dx / len;
        const w  = stripeWidth / 2;
        ctx.beginPath();
        ctx.moveTo(a.x1 + nx * w, a.y1 + ny * w);
        ctx.lineTo(a.x2 + nx * w, a.y2 + ny * w);
        ctx.lineTo(a.x2 - nx * w, a.y2 - ny * w);
        ctx.lineTo(a.x1 - nx * w, a.y1 - ny * w);
        ctx.closePath();
        ctx.fill();
      }
    }
    function drawFloor() {
      ctx.fillStyle = '#0f0d14';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#1c1426';
      ctx.fillRect(WALL, WALL, W - 2*WALL, H - 2*WALL);
      // Subtle carpet dots
      ctx.fillStyle = 'rgba(200, 155, 60, 0.035)';
      for (let yy = WALL + 14; yy < H - WALL; yy += 32) {
        const off = ((yy / 32) | 0) % 2 === 0 ? 0 : 16;
        for (let xx = WALL + 14 + off; xx < W - WALL; xx += 32) {
          ctx.beginPath();
          ctx.arc(xx, yy, 1.2, 0, Math.PI*2);
          ctx.fill();
        }
      }
      drawAisles();

      for (const r of ROOMS) drawRoom(r);
      drawPit();
      drawHL();
      drawOuter();
      drawCrossroads();
      for (const b of BANKS) drawBankBg(b);
    }
    function drawRoom(r) {
      const palette = {
        service:     ['rgba(108, 92, 231, 0.12)', 'rgba(108, 92, 231, 0.45)'],
        vip:         ['rgba(200, 155, 60, 0.12)', 'rgba(200, 155, 60, 0.50)'],
        wc:          ['rgba(96, 165, 250, 0.10)', 'rgba(96, 165, 250, 0.45)'],
        hospitality: ['rgba(244, 114, 182, 0.10)','rgba(244, 114, 182, 0.45)'],
        dining:      ['rgba(248, 113, 113, 0.10)','rgba(248, 113, 113, 0.45)'],
        exit:        ['rgba(252, 165, 90, 0.10)', 'rgba(252, 165, 90, 0.50)'],
      };
      const [bg, stroke] = palette[r.kind] || palette.service;
      ctx.fillStyle = bg;
      roundRect(ctx, r.x, r.y, r.w, r.h, 8);
      ctx.fill();
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = stroke;
      ctx.stroke();
      ctx.fillStyle = '#d8d4ea';
      ctx.font = '600 12px Inter, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(r.label, r.x + r.w / 2, r.y + r.h / 2);
    }
    function drawPit() {
      ctx.fillStyle = 'rgba(34, 197, 94, 0.08)';
      roundRect(ctx, PIT.x, PIT.y, PIT.w, PIT.h, 16);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.strokeStyle = 'rgba(34, 197, 94, 0.55)';
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(167, 243, 208, 0.85)';
      ctx.font = '800 11px Inter, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(PIT.label, PIT.x + PIT.w / 2, PIT.y + 8);
      const tables = [
        { x: PIT.x +  50, y: PIT.y +  60, t: 'BJ' },{ x: PIT.x + 145, y: PIT.y +  60, t: 'BJ' },
        { x: PIT.x + 240, y: PIT.y +  60, t: 'RL' },{ x: PIT.x + 320, y: PIT.y +  60, t: 'BC' },
        { x: PIT.x +  50, y: PIT.y + 140, t: 'BJ' },{ x: PIT.x + 145, y: PIT.y + 140, t: 'BJ' },
        { x: PIT.x + 240, y: PIT.y + 140, t: 'RL' },{ x: PIT.x + 320, y: PIT.y + 140, t: 'CR' },
      ];
      for (const t of tables) {
        ctx.fillStyle = 'rgba(34, 197, 94, 0.18)';
        ctx.strokeStyle = 'rgba(34, 197, 94, 0.55)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.ellipse(t.x, t.y, 32, 18, 0, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(167, 243, 208, 0.9)';
        ctx.font = '700 10px Inter, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(t.t, t.x, t.y);
      }
    }
    function drawHL() {
      ctx.fillStyle = 'rgba(200, 155, 60, 0.07)';
      roundRect(ctx, HL_ROOM.x, HL_ROOM.y, HL_ROOM.w, HL_ROOM.h, 14);
      ctx.fill();
      ctx.lineWidth = 2.4;
      ctx.strokeStyle = 'rgba(200, 155, 60, 0.65)';
      ctx.stroke();
      ctx.fillStyle = 'rgba(200, 155, 60, 0.9)';
      ctx.font = '800 11px Inter, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(HL_ROOM.label, HL_ROOM.x + HL_ROOM.w / 2, HL_ROOM.y + 10);
      ctx.strokeStyle = '#1c1426';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(HL_ROOM.x, HL_ROOM.y + HL_ROOM.h / 2 - 26);
      ctx.lineTo(HL_ROOM.x, HL_ROOM.y + HL_ROOM.h / 2 + 26);
      ctx.stroke();
    }
    function drawCrossroads() {
      const { cx, cy, r, label } = CROSSROADS;
      ctx.fillStyle = 'rgba(60, 40, 14, 0.6)';
      ctx.beginPath(); ctx.arc(cx, cy, r + 6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(120, 84, 38, 0.55)';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(200, 155, 60, 0.85)';
      ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.55, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(200, 155, 60, 0.55)'; ctx.lineWidth = 1.5; ctx.stroke();
      const stoolR = r * 0.78;
      ctx.fillStyle = 'rgba(200, 155, 60, 0.65)';
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI*2;
        ctx.beginPath(); ctx.arc(cx + stoolR*Math.cos(a), cy + stoolR*Math.sin(a), 3, 0, Math.PI*2); ctx.fill();
      }
      ctx.fillStyle = 'rgba(255, 234, 200, 0.95)';
      ctx.font = '800 12px Inter, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, cx, cy - 6);
      ctx.font = '700 9px Inter, sans-serif';
      ctx.fillStyle = 'rgba(255, 234, 200, 0.65)';
      ctx.fillText('SPORTS BAR', cx, cy + 8);
    }
    function drawOuter() {
      const x0 = WALL, y0 = WALL, x1 = W - WALL, y1 = H - WALL;
      ctx.strokeStyle = '#4a4258';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x0, y0); ctx.lineTo(ENTRANCE.x0, y0);
      ctx.moveTo(ENTRANCE.x1, y0); ctx.lineTo(x1, y0);
      ctx.moveTo(x1, y0); ctx.lineTo(x1, y1);
      ctx.moveTo(x1, y1); ctx.lineTo(x0, y1);
      ctx.moveTo(x0, y1); ctx.lineTo(x0, y0);
      ctx.stroke();
      ctx.fillStyle = 'rgba(200, 155, 60, 0.85)';
      ctx.font = '700 11px Inter, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('▼  ENTRANCE  ▼', (ENTRANCE.x0 + ENTRANCE.x1) / 2, y0 - 4);
    }
    function drawBankBg(b) {
      const own = machinesByBank[b.id];
      if (!own || !own.length) return;
      const pad = 12;
      if (b.kind === 'linear' && (b.angle || 0) !== 0) {
        ctx.save();
        ctx.translate(b.cx, b.cy);
        ctx.rotate(b.angle);
        const halfW = ((b.cols - 1) * b.sx) / 2 + pad;
        const halfH = ((b.rows - 1) * b.sy) / 2 + pad + 4;
        ctx.fillStyle = b.hl ? 'rgba(200, 155, 60, 0.06)' : 'rgba(108, 92, 231, 0.06)';
        roundRect(ctx, -halfW, -halfH, halfW*2, halfH*2, 10);
        ctx.fill();
        ctx.strokeStyle = b.hl ? 'rgba(200, 155, 60, 0.35)' : 'rgba(108, 92, 231, 0.20)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
      } else {
        const minX = Math.min(...own.map(m => m.x)) - pad;
        const minY = Math.min(...own.map(m => m.y)) - pad;
        const maxX = Math.max(...own.map(m => m.x)) + pad;
        const maxY = Math.max(...own.map(m => m.y)) + pad;
        ctx.fillStyle = b.hl ? 'rgba(200, 155, 60, 0.06)' : 'rgba(108, 92, 231, 0.06)';
        roundRect(ctx, minX, minY, maxX - minX, maxY - minY, 10);
        ctx.fill();
        ctx.strokeStyle = b.hl ? 'rgba(200, 155, 60, 0.35)' : 'rgba(108, 92, 231, 0.20)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      if (!b.hl) {
        ctx.fillStyle = 'rgba(176, 167, 207, 0.85)';
        ctx.font = '700 10px Inter, sans-serif';
        ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
        const own2 = machinesByBank[b.id];
        const minX2 = Math.min(...own2.map(m => m.x)) - 12;
        const minY2 = Math.min(...own2.map(m => m.y)) - 12;
        const tx = b.kind === 'carousel' ? (b.cx - b.r) : minX2 + 2;
        const ty = b.kind === 'carousel' ? (b.cy - b.r - 4) : minY2 - 2;
        ctx.fillText(b.id + ' · ' + b.label, tx, ty);
      }
    }

    // ====================================================================
    // ANIMATION — players, machine state, win flashes
    // ====================================================================
    // Per-frame derived state, reused between draw + HUD update
    const machineState = new Map();     // machine.id -> { occupied: bool, color, recentWin }
    const bankOccupied = {};            // bankId -> count
    const zoneOccupied = {};            // zone -> count
    let onFloorCount = 0;
    let activeMachineCount = 0;
    let visitorsTotalUntilNow = 0;
    const recentWins = [];              // { at_h, machine, size }
    let cumulativeWinsByHour = new Array(25).fill(0);
    // Pre-compute cumulative wins for "this hour" indicator
    {
      const winsAt = [];
      for (const p of players) {
        for (const l of p.legs) if (l.win) winsAt.push(l.win.at_h);
      }
      winsAt.sort((a,b)=>a-b);
      for (let h = 0; h < 25; h++) {
        cumulativeWinsByHour[h] = winsAt.filter(t => t < h).length;
      }
    }

    function computeFrame(t_h) {
      machineState.clear();
      Object.keys(bankOccupied).forEach(k => delete bankOccupied[k]);
      ZONES.forEach(z => zoneOccupied[z] = 0);
      onFloorCount = 0;
      activeMachineCount = 0;
      visitorsTotalUntilNow = 0;
      recentWins.length = 0;

      // Visitors who have arrived by now
      for (const p of players) {
        if (p.arrive_h <= t_h) visitorsTotalUntilNow++;
        else break; // sorted
      }

      const playerPositions = [];
      const WIN_WINDOW = 0.04; // sim-hours window for "recent" win pulse (≈ 2.4 min)

      for (const p of players) {
        if (p.arrive_h > t_h) break;
        if (p.exit_h < t_h) continue;
        // find current leg
        let leg = null;
        for (const l of p.legs) {
          if (t_h >= l.startWalk_h && t_h <= (l.isExit ? l.startSit_h : l.endSit_h)) {
            leg = l;
            break;
          }
        }
        if (!leg) continue;

        // Position
        let pos;
        if (t_h < leg.startSit_h) {
          const frac = (t_h - leg.startWalk_h) / Math.max(1e-6, leg.startSit_h - leg.startWalk_h);
          pos = positionOnPath(leg.path, frac);
        } else if (leg.isExit) {
          // standing at exit — don't draw (already left)
          continue;
        } else {
          pos = { x: leg.machine.x, y: leg.machine.y };
          // sitting → machine occupied
          const m = leg.machine;
          const already = machineState.has(m.id);
          const st = machineState.get(m.id) || { occupied: false, recentWin: null, color: null };
          st.occupied = true;
          st.color = p.color;
          if (leg.win && Math.abs(t_h - leg.win.at_h) < WIN_WINDOW) {
            st.recentWin = { ...leg.win, age_h: t_h - leg.win.at_h, intensity: 1 - Math.abs(t_h - leg.win.at_h) / WIN_WINDOW };
            recentWins.push({ machine: m, ...leg.win });
          }
          machineState.set(m.id, st);
          // Count each machine only once even if two players share it visually
          if (!already) {
            bankOccupied[m.bank] = (bankOccupied[m.bank] || 0) + 1;
            zoneOccupied[m.zone] = (zoneOccupied[m.zone] || 0) + 1;
          }
        }
        playerPositions.push({ player: p, leg, pos });
        onFloorCount++;
      }
      activeMachineCount = machineState.size;
      return playerPositions;
    }

    function drawMachineLayer() {
      // Draw each machine; occupied ones get a glow
      for (const m of machines) {
        const st = machineState.get(m.id);
        const r = m.hl ? 9 : 7;
        // Glow if occupied
        if (st && st.occupied) {
          const glowR = (m.hl ? 16 : 13);
          const grad = ctx.createRadialGradient(m.x, m.y, 1, m.x, m.y, glowR);
          grad.addColorStop(0, 'rgba(251, 191, 36, 0.55)');
          grad.addColorStop(1, 'rgba(251, 191, 36, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath(); ctx.arc(m.x, m.y, glowR, 0, Math.PI*2); ctx.fill();
        }
        // Cabinet
        if (st && st.occupied) {
          ctx.fillStyle = m.hl ? '#fbbf24' : '#facc15';
        } else {
          ctx.fillStyle = m.hl ? '#7a6534' : '#3a5d48';
        }
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.lineWidth = 1;
        roundRect(ctx, m.x - r, m.y - r, r*2, r*2, 2.5);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = st && st.occupied
          ? (m.hl ? '#4a3a14' : '#3a3008')
          : (m.hl ? '#5a4a2a' : '#1c3024');
        ctx.fillRect(m.x - r + 2, m.y - r + 2, r*2 - 4, r*2 - 6);

        // Win pulse
        if (st && st.recentWin) {
          const i = st.recentWin.intensity;
          const big = st.recentWin.size === 'big';
          const maxR = (big ? 36 : 22) * (1 - i*0.4);
          const alpha = i * (big ? 0.95 : 0.65);
          ctx.strokeStyle = 'rgba(251, 191, 36, ' + alpha + ')';
          ctx.lineWidth = big ? 3 : 2;
          ctx.beginPath(); ctx.arc(m.x, m.y, maxR, 0, Math.PI*2); ctx.stroke();
          if (big) {
            ctx.strokeStyle = 'rgba(255, 234, 130, ' + (alpha * 0.6) + ')';
            ctx.lineWidth = 6;
            ctx.beginPath(); ctx.arc(m.x, m.y, maxR * 0.6, 0, Math.PI*2); ctx.stroke();
          }
        }
      }

      // Optional machine IDs
      if (ui.showIds) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.font = '9px ui-monospace, SFMono-Regular, Menlo, monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        for (const m of machines) {
          ctx.fillText(m.id.replace('EGM-', ''), m.x, m.y + (m.hl ? 11 : 9));
        }
      }
    }

    function drawPlayerLayer(positions) {
      // Optional walking-path strokes
      if (ui.showPaths) {
        ctx.lineWidth = 1.2;
        for (const pp of positions) {
          if (pp.leg.machine == null && !pp.leg.isExit) continue;
          if (pp.leg.startSit_h <= time.sim_h && !pp.leg.isExit) continue; // sitting, skip
          const path = pp.leg.path;
          ctx.strokeStyle = pp.player.color + '40';
          ctx.beginPath();
          ctx.moveTo(path.points[0].x, path.points[0].y);
          for (let i = 1; i < path.points.length; i++) {
            ctx.lineTo(path.points[i].x, path.points[i].y);
          }
          ctx.stroke();
        }
      }

      // Player dots
      for (const pp of positions) {
        const isTournament = pp.player.tag === 'tournament';
        const r = isTournament ? 5 : 4;
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath(); ctx.arc(pp.pos.x + 1, pp.pos.y + 1, r, 0, Math.PI*2); ctx.fill();
        // Dot
        ctx.fillStyle = pp.player.color;
        ctx.beginPath(); ctx.arc(pp.pos.x, pp.pos.y, r, 0, Math.PI*2); ctx.fill();
        // Tournament players get a halo
        if (isTournament) {
          ctx.strokeStyle = 'rgba(253, 224, 71, 0.85)';
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(pp.pos.x, pp.pos.y, r + 2, 0, Math.PI*2); ctx.stroke();
        }
      }
    }

    function drawJackpotEvent(t_h) {
      const ev = events.find(e => e.kind === 'jackpot');
      if (!ev) return;
      const dt = t_h - ev.at_h;
      if (dt < -0.15 || dt > 0.5) return;
      // Big golden ring pulsing from the C-01 bank center
      const bank = BANK_MAP['C-01'];
      const cx = bank.cx, cy = bank.cy;
      // Pre-event: faint glow building up
      if (dt < 0) {
        const i = 1 + dt / 0.15; // 0 -> 1
        ctx.strokeStyle = 'rgba(251, 191, 36, ' + (0.2 * i) + ')';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(cx, cy, 70 + i*8, 0, Math.PI*2); ctx.stroke();
      } else {
        const i = 1 - dt / 0.5;
        const R = 80 + dt * 240;
        ctx.strokeStyle = 'rgba(251, 191, 36, ' + (i * 0.85) + ')';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.stroke();
        ctx.strokeStyle = 'rgba(255, 234, 130, ' + (i * 0.5) + ')';
        ctx.lineWidth = 12;
        ctx.beginPath(); ctx.arc(cx, cy, R * 0.5, 0, Math.PI*2); ctx.stroke();
        // Floating "JACKPOT!" text
        if (dt < 0.25) {
          ctx.fillStyle = 'rgba(255, 234, 130, ' + (i * 1) + ')';
          ctx.font = '900 22px Inter, sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('★ JACKPOT! ★', cx, cy - 30 - dt * 40);
        }
      }
    }

    // ====================================================================
    // HUD updates
    // ====================================================================
    const elClock = document.getElementById('clock');
    const elOnFloor = document.getElementById('kpiOnFloor');
    const elActive  = document.getElementById('kpiActive');
    const elVisitors= document.getElementById('kpiVisitors');
    const elWins    = document.getElementById('kpiWins');
    const elZones   = document.getElementById('zonesList');
    const elHotBanks= document.getElementById('hotBanks');
    const elEventsList = document.getElementById('eventsList');
    const elScrubFill  = document.getElementById('scrubFill');
    const elScrubKnob  = document.getElementById('scrubKnob');

    // Build zone rows once
    elZones.innerHTML = ZONES.map(z =>
      `<div class="zone" data-z="${z}">
         <span class="lbl">${ZONE_LABEL[z]}</span>
         <div class="bar"><div class="fill" id="zone-${z}" style="width:0%"></div></div>
         <span class="pct" id="zonepct-${z}">0%</span>
       </div>`
    ).join('');

    // Build event rows once
    function fmtH(h) {
      const hh = Math.floor(h);
      const mm = Math.round((h - hh) * 60);
      return String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
    }
    const eventDescriptions = [
      { at_h: 19.5, desc: '★ Mini-jackpot at Buffalo Country (C-01) draws a crowd.' },
      { at_h: 22.0, desc: '🏆 High-Limit Tournament — 12 elite players in the HL room.' },
    ];
    elEventsList.innerHTML = eventDescriptions.map((e, i) =>
      `<div class="event" id="event-${i}" data-h="${e.at_h}">
         <time>${fmtH(e.at_h)}</time>
         <span class="desc">${e.desc}</span>
       </div>`
    ).join('');

    let hudThrottle = 0;
    function updateHUD(t_h) {
      // Clock + scrubber
      elClock.textContent = fmtH(t_h);
      const pct = (t_h / 24) * 100;
      elScrubFill.style.width = pct + '%';
      elScrubKnob.style.left = pct + '%';
      // Throttle the rest to ~10 Hz
      const now = performance.now();
      if (now - hudThrottle < 90) return;
      hudThrottle = now;

      elOnFloor.textContent  = onFloorCount;
      elActive.textContent   = activeMachineCount + ' / ' + machines.length;
      elVisitors.textContent = visitorsTotalUntilNow;

      // Wins last hour
      const lo = Math.max(0, Math.floor(t_h));
      const hi = Math.min(24, lo + 1);
      const winsThisHour = cumulativeWinsByHour[hi] - cumulativeWinsByHour[lo];
      const winsSoFarThisHour = Math.round(winsThisHour * (t_h - lo));
      elWins.textContent = winsSoFarThisHour;

      // Zones
      for (const z of ZONES) {
        const total = zoneMachineCounts[z] || 1;
        const occ   = zoneOccupied[z] || 0;
        const p = Math.round((occ / total) * 100);
        document.getElementById('zone-' + z).style.width = p + '%';
        document.getElementById('zonepct-' + z).textContent = p + '%';
      }

      // Top 3 hot banks (by absolute occupancy)
      const entries = Object.entries(bankOccupied)
        .filter(([id]) => BANK_MAP[id])
        .map(([id, n]) => ({ id, n, b: BANK_MAP[id] }))
        .sort((a, b) => b.n - a.n)
        .slice(0, 3);
      elHotBanks.innerHTML = entries.length === 0
        ? `<div class="bank-row"><span class="lbl">—</span><span class="occ">—</span></div>`
        : entries.map(e => {
          const cap = machinesByBank[e.id].length;
          return `<div class="bank-row">
              <span><span class="id">${e.id}</span> <span class="lbl">${e.b.label}</span></span>
              <span class="occ">${e.n}/${cap}</span>
            </div>`;
        }).join('');

      // Event states (live / past)
      eventDescriptions.forEach((e, i) => {
        const el = document.getElementById('event-' + i);
        const liveWindow = i === 0 ? 0.3 : 1.0;
        el.classList.toggle('live', t_h >= e.at_h && t_h < e.at_h + liveWindow);
        el.classList.toggle('past', t_h >= e.at_h + liveWindow);
      });
    }

    // ====================================================================
    // Hit testing + tooltip
    // ====================================================================
    function clientToLogical(cx, cy) {
      const r = canvas.getBoundingClientRect();
      return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H };
    }
    function hitTest(px, py) {
      let best = null, bestD2 = Infinity;
      for (const m of machines) {
        const dx = m.x - px, dy = m.y - py;
        const d2 = dx*dx + dy*dy;
        const rr = m.hl ? 12 : 10;
        if (d2 < rr*rr && d2 < bestD2) { bestD2 = d2; best = m; }
      }
      return best;
    }
    canvas.addEventListener('mousemove', (e) => {
      const p = clientToLogical(e.clientX, e.clientY);
      const m = hitTest(p.x, p.y);
      ui.hover = m;
      if (m) {
        canvas.style.cursor = 'pointer';
        const sR = stage.getBoundingClientRect();
        const cR = canvas.getBoundingClientRect();
        tooltip.style.left = (cR.left - sR.left + (m.x / W) * cR.width)  + 'px';
        tooltip.style.top  = (cR.top  - sR.top  + (m.y / H) * cR.height) + 'px';
        const occCount = bankOccupied[m.bank] || 0;
        const bankCap  = machinesByBank[m.bank].length;
        const st = machineState.get(m.id);
        tooltip.innerHTML =
          `<b>${m.id}</b> · ${m.bank} ${m.bankLabel}` +
          (m.hl ? ' · HL' : '') +
          `<br>${st && st.occupied ? '<b style="color:#fbbf24">PLAYING</b>' : 'idle'}` +
          ` · bank ${occCount}/${bankCap}` +
          `<br><code>x=${m.x}, y=${m.y}</code>`;
        tooltip.classList.add('is-on');
      } else {
        canvas.style.cursor = 'crosshair';
        tooltip.classList.remove('is-on');
      }
    });
    canvas.addEventListener('mouseleave', () => {
      ui.hover = null;
      tooltip.classList.remove('is-on');
    });

    // ====================================================================
    // Main loop
    // ====================================================================
    let lastStageW = 0, lastStageH = 0;
    function maybeResize() {
      const sw = stage.clientWidth, sh = stage.clientHeight;
      if (sw !== lastStageW || sh !== lastStageH) {
        lastStageW = sw; lastStageH = sh;
        resize();
      }
    }
    function frame(ts) {
      if (!time.lastTs) time.lastTs = ts;
      const dt_real_s = (ts - time.lastTs) / 1000;
      time.lastTs = ts;
      if (time.playing && !scrubbing) {
        const dt_sim_h = (dt_real_s * time.speed) / 3600;
        time.sim_h = (time.sim_h + dt_sim_h);
        if (time.sim_h >= 24) time.sim_h = time.sim_h - 24;
      }
      maybeResize();

      const positions = computeFrame(time.sim_h);

      // Render
      drawFloor();
      drawMachineLayer();
      drawJackpotEvent(time.sim_h);
      drawPlayerLayer(positions);

      // Hover ring on top
      if (ui.hover) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(ui.hover.x, ui.hover.y, (ui.hover.hl ? 9 : 7) + 5, 0, Math.PI*2);
        ctx.stroke();
      }

      updateHUD(time.sim_h);
      requestAnimationFrame(frame);
    }

    // ====================================================================
    // Init
    // ====================================================================
    requestAnimationFrame(() => { resize(); requestAnimationFrame(frame); });
    setSpeed(600);
    setPlaying(true);

    // Expose for console exploration
    window.casinoFloor = { machines, BANKS, players, events, time };
  })();
  </script>
</body>
</html>
