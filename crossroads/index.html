    }

    .top .spacer { flex: 1; }
    .top label {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: #b8b3cc; cursor: pointer; user-select: none;
    }
    .top label input { accent-color: #c89b3c; }
    .top a {
      color: #a78bfa; font-size: 12px; text-decoration: none;
    }
    .top a:hover { text-decoration: underline; }

      display: flex; align-items: center; gap: 12px;
      padding: 0 16px; background: #14101c; border-bottom: 1px solid #2a2540;

    .clock-wrap { min-width: 118px; }
    .clock {

      color: #f8e7b0; letter-spacing: 0.5px;
    }
    .period {
      font: 600 9px/1 'IBM Plex Sans', sans-serif;

    }
    .timebar button.icon {
      background: #2a2540; border: 1px solid #3a3454; color: #e7e3f3;
      width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .timebar button.icon.primary { background: #c89b3c; color: #14101c; border-color: #c89b3c; }
    .speed { display: inline-flex; gap: 4px; }
    .speed button {
      background: #2a2540; border: 1px solid #3a3454; color: #b8b3cc;
      padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; cursor: pointer;

    .scrub {
      flex: 1; height: 40px; position: relative;
      background: #120e1a; border-radius: 10px; cursor: pointer; overflow: hidden;
      border: 1px solid #2a2540;
    }
    .scrub canvas {
      position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
    }
    .scrub .fill {
      position: absolute; left: 0; top: 0; bottom: 0;
      background: linear-gradient(90deg, rgba(200,155,60,0.45), rgba(251,191,36,0.55));
      pointer-events: none;
    }
    .scrub .hours {

    .scrub .hours span {
      flex: 1; border-right: 1px solid rgba(255,255,255,0.05);
      display: flex; align-items: flex-end; justify-content: center;

    .scrub .hours span:nth-child(6n) { color: rgba(255,234,200,0.85); }
    .scrub .events { position: absolute; inset: 0; pointer-events: none; }
    .scrub .events i {

      background: rgba(251,191,36,0.9); border-radius: 2px;
      box-shadow: 0 0 6px rgba(251,191,36,0.6);

    .scrub .knob {

      box-shadow: 0 0 0 3px rgba(200,155,60,0.4); pointer-events: none;

    const HL_ROOM = { x: 1180, y: 170, w: 150, h: 580, label: 'HIGH LIMIT' };

    // Loaded from data/corridors.json (shared with CAD PDF)
    let CORRIDORS = [];
    let BANK_APPROACH = {};

    const TIERS = ['Member', 'Gold', 'Platinum', 'Elite'];
    const TIER_COLOR = {

    const ROOMS = [

      { label: 'Casual Dining', x: 570, y: 770, w: 240, h: 86, kind: 'dining' },
      { label: 'Restrooms', x: 830, y: 770, w: 120, h: 86, kind: 'wc' },
      { label: 'Emergency Exit', x: 970, y: 770, w: 360, h: 86, kind: 'exit' },
    ];
    const BANKS = [
      { id: 'C-01', label: 'Buffalo Country', kind: 'carousel', cx: 320, cy: 280, r: 56, zone: 'N' },
      { id: 'L-01', label: 'Lightning Link', kind: 'linear', cx: 610, cy: 250, cols: 5, rows: 2, sx: 38, sy: 38, angle: 0, zone: 'N' },

      { id: 'L-03', label: 'Wheel of Fortune', kind: 'linear', cx: 1000, cy: 460, cols: 4, rows: 2, sx: 38, sy: 38, angle: 0, zone: 'E' },
      { id: 'L-04', label: 'Megabucks', kind: 'linear', cx: 1000, cy: 600, cols: 4, rows: 2, sx: 38, sy: 38, angle: 0.18, zone: 'E' },
      { id: 'L-05', label: 'Penny Park', kind: 'linear', cx: 640, cy: 620, cols: 6, rows: 1, sx: 38, sy: 0, angle: 0, zone: 'S' },
      { id: 'L-06', label: 'Mystery Cash', kind: 'linear', cx: 640, cy: 680, cols: 6, rows: 1, sx: 38, sy: 0, angle: 0, zone: 'S' },
      { id: 'C-03', label: 'Dragon Link', kind: 'carousel', cx: 880, cy: 650, r: 48, zone: 'S' },
      { id: 'L-07', label: 'Classic Reels', kind: 'linear', cx: 200, cy: 280, cols: 3, rows: 2, sx: 38, sy: 38, angle: 0, zone: 'W' },
      { id: 'L-08', label: 'Hollywood Hits', kind: 'linear', cx: 200, cy: 430, cols: 3, rows: 2, sx: 38, sy: 38, angle: -0.22, zone: 'W' },
      { id: 'C-04', label: 'Video Poker', kind: 'carousel', cx: 480, cy: 410, r: 50, zone: 'W' },
      { id: 'HL-01', label: 'HL Salon', kind: 'linear', cx: 1235, cy: 330, cols: 1, rows: 4, sx: 0, sy: 52, angle: 0, zone: 'HL', hl: true },
      { id: 'HL-02', label: 'HL Plus', kind: 'linear', cx: 1290, cy: 330, cols: 1, rows: 4, sx: 0, sy: 52, angle: 0, zone: 'HL', hl: true },
      { id: 'HL-03', label: 'Whale Lounge', kind: 'linear', cx: 1260, cy: 600, cols: 2, rows: 2, sx: 50, sy: 56, angle: 0, zone: 'HL', hl: true },
    ];
    const BANK_MAP = Object.fromEntries(BANKS.map(b => [b.id, b]));
    // Leisurely casino pace
    const WALK_MIN_PER_100PX = 1.45;
    const HEAT_WINDOW_H = 1.0;

    // Build navigation graph from corridor polylines
    function keyXY(x, y) {
      return Math.round(x / 8) * 8 + ',' + Math.round(y / 8) * 8;
    }
    let NAV = { nodes: [], edges: [] };
    const pathCache = new Map();
    function buildNavGraph(corridors) {
      pathCache.clear();
      const nodes = [];
      const index = new Map();
      const edges = [];
      function ensure(x, y) {
        const k = keyXY(x, y);
        if (index.has(k)) return index.get(k);
        const i = nodes.length;
        nodes.push({ x: Math.round(x / 8) * 8, y: Math.round(y / 8) * 8 });
        index.set(k, i);
        edges.push([]);
        return i;
      }
      function link(a, b) {
        if (a === b) return;
        const d = Math.hypot(nodes[a].x - nodes[b].x, nodes[a].y - nodes[b].y);
        if (d < 0.5) return;
        if (!edges[a].some(e => e.to === b)) edges[a].push({ to: b, d });
        if (!edges[b].some(e => e.to === a)) edges[b].push({ to: a, d });
      }
      function sampleSeg(x1, y1, x2, y2, step) {
        const len = Math.hypot(x2 - x1, y2 - y1);
        const n = Math.max(1, Math.ceil(len / step));
        const idxs = [];
        for (let i = 0; i <= n; i++) {
          const t = i / n;
          idxs.push(ensure(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t));
        }
        for (let i = 1; i < idxs.length; i++) link(idxs[i - 1], idxs[i]);
      }
      for (const c of corridors) {
        for (let i = 1; i < c.pts.length; i++) {
          const a = c.pts[i - 1], b = c.pts[i];
          sampleSeg(a[0], a[1], b[0], b[1], 28);
        }
      }
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const d = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y);
          if (d > 0 && d <= 36) link(i, j);
        }
      }
      return { nodes, edges };
    }

    function nearestNav(p) {
      let best = 0, bestD = Infinity;
      for (let i = 0; i < NAV.nodes.length; i++) {
        const d = Math.hypot(p.x - NAV.nodes[i].x, p.y - NAV.nodes[i].y);
        if (d < bestD) { bestD = d; best = i; }
      }
      return best;
    }

    function dijkstraNav(fromIdx, toIdx) {
      if (fromIdx === toIdx) return [fromIdx];
      const n = NAV.nodes.length;
      const dist = new Float64Array(n).fill(Infinity);
      const prev = new Int32Array(n).fill(-1);
      // binary-heap-ish via simple scan is OK if cached; add early exit
      const used = new Uint8Array(n);
      dist[fromIdx] = 0;
      for (let iter = 0; iter < n; iter++) {
        let u = -1, best = Infinity;
        for (let i = 0; i < n; i++) {
          if (!used[i] && dist[i] < best) { best = dist[i]; u = i; }
        }
        if (u < 0) break;
        if (u === toIdx) break;
        used[u] = 1;
        for (const e of NAV.edges[u]) {
          const nd = dist[u] + e.d;
          if (nd < dist[e.to]) { dist[e.to] = nd; prev[e.to] = u; }
        }
      }
      if (!isFinite(dist[toIdx])) return [fromIdx, toIdx];
      const path = [];
      for (let cur = toIdx; cur !== -1; cur = prev[cur]) path.push(cur);
      path.reverse();
      return path;
    }

    function finalizePath(points) {
      let total = 0;
      const segs = [];
      for (let i = 1; i < points.length; i++) {
        const seg = Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
        total += seg;
        segs.push(seg);
      }
      return { points, segs, total };
    }

    function approachForMachine(m) {
      const ap = BANK_APPROACH[m.bank];
      if (ap) return { ...ap };
      // fallback: offset toward Crossroads
      const dx = CROSSROADS.cx - m.x, dy = CROSSROADS.cy - m.y;
      const len = Math.hypot(dx, dy) || 1;
      return { x: m.x + (dx / len) * 28, y: m.y + (dy / len) * 28 };
    }

    function buildPath(origin, dest) {
      const a = nearestNav(origin);
      const b = nearestNav(dest);
      const cacheKey = a + '>' + b;
      let midPts = pathCache.get(cacheKey);
      if (!midPts) {
        const idxs = dijkstraNav(a, b);
        midPts = idxs.map(i => ({ x: NAV.nodes[i].x, y: NAV.nodes[i].y }));
        pathCache.set(cacheKey, midPts);
      }
      const points = [{ ...origin }, ...midPts.map(p => ({ ...p })), { ...dest }];
      const cleaned = [points[0]];
      for (let i = 1; i < points.length; i++) {
        const p = points[i], q = cleaned[cleaned.length - 1];
        if (Math.hypot(p.x - q.x, p.y - q.y) > 5) cleaned.push(p);
      }
      return finalizePath(cleaned);
    }

    function positionOnPath(path, frac) {
      if (!path.total) return path.points[0];
      const e = frac < 0.5 ? 2 * frac * frac : 1 - Math.pow(-2 * frac + 2, 2) / 2;
      const target = path.total * Math.max(0, Math.min(1, e));
      let acc = 0;
      for (let i = 0; i < path.segs.length; i++) {
        if (acc + path.segs[i] >= target) {
          const t = (target - acc) / path.segs[i];
          const a = path.points[i], b = path.points[i + 1];
          return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
        }
        acc += path.segs[i];
      }
      return path.points[path.points.length - 1];
    }
    function walkHours(dist) {
      return Math.max(0.03, (dist * WALK_MIN_PER_100PX) / 100 / 60);
    }

    // ---- helpers ----
    function parseHours(iso) {
      const p = iso.slice(11).split(':').map(Number);
      return p[0] + p[1] / 60 + (p[2] || 0) / 3600;
    }
    function fmtH(h) {
      h = ((h % 24) + 24) % 24;
      const hh = Math.floor(h);
      const mm = Math.floor((h - hh) * 60);
      return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    }
    function money(n) {
      if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
      if (n >= 1000) return '$' + Math.round(n).toLocaleString();
      return '$' + Math.round(n);
    }
    function roundRect(c, x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      c.beginPath();
      c.moveTo(x + rr, y);
      c.arcTo(x + w, y, x + w, y + h, rr);
      c.arcTo(x + w, y + h, x, y + h, rr);
      c.arcTo(x, y + h, x, y, rr);
      c.arcTo(x, y, x + w, y, rr);
      c.closePath();
    }
    function avoidCircle(p1, p2, cx, cy, R) {
      const minX = Math.min(p1.x, p2.x) - R, maxX = Math.max(p1.x, p2.x) + R;
      const minY = Math.min(p1.y, p2.y) - R, maxY = Math.max(p1.y, p2.y) + R;
      if (cx < minX || cx > maxX || cy < minY || cy > maxY) return null;
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len2 = dx * dx + dy * dy;
      if (len2 < 1e-3) return null;
      const t = ((cx - p1.x) * dx + (cy - p1.y) * dy) / len2;
      if (t <= 0 || t >= 1) return null;
      const px = p1.x + t * dx, py = p1.y + t * dy;
      if (Math.hypot(px - cx, py - cy) >= R) return null;
      const len = Math.sqrt(len2);
      const nx = -dy / len, ny = dx / len;
      const sign = ((p1.x - cx) * nx + (p1.y - cy) * ny) > 0 ? 1 : -1;
      return { x: (p1.x + p2.x) / 2 + nx * sign * R, y: (p1.y + p2.y) / 2 + ny * sign * R };
    }

    // Heat color: cool purple → hot amber
    function heatColor(t) {
      const r = Math.round(80 + t * 175);
      const g = Math.round(60 + t * 100);
      const b = Math.round(160 - t * 120);
      return `rgba(${r},${g},${b},`;
    }

    // ---- data ----
    let machines = [];
    let machineById = {};
    let machinesByBank = {};
    let sessions = [];
    let sessionsByStart = []; // sorted
    let walkers = []; // optional walk segments
    let stories = [];

    function buildWalkers(sessionsList) {
      byPlayer = new Map();
      for (const s of sessionsList) {
        if (!byPlayer.has(s.player_id)) byPlayer.set(s.player_id, []);
        byPlayer.get(s.player_id).push(s);
      }
      const out = [];
      for (const [player_id, list] of byPlayer) {
        list.sort((a, b) => a.start_dt.localeCompare(b.start_dt));
        let pos = { ...ENTRY };
        for (let i = 0; i < list.length; i++) {
          const s = list[i];
          const m = machineById[s.asset_id];
          if (!m) continue;
          const start_h = parseHours(s.start_dt);
          const color = TIER_COLOR[s.tier] || TIER_COLOR.Member;
          const dest = approachForMachine(m);
          const path = buildPath(pos, dest);
          const need = walkHours(path.total);

          let gapStart;
          if (i === 0) {
            gapStart = Math.max(0, start_h - Math.max(need, 0.08));
          } else {
            gapStart = parseHours(list[i - 1].end_dt);
          }
          const gap = Math.max(0, start_h - gapStart);
          if (gap < 0.008) {
            pos = dest;
            continue;
          }

          // Prefer: linger near previous spot, then stroll the aisle to next machine
          let walkDur = Math.min(need, gap * 0.85);
          // Cap walk so it never feels frantic: at least 2 min real for short hops when gap allows
          if (gap > 0.06) walkDur = Math.max(walkDur, Math.min(need * 1.15, gap * 0.7));
          walkDur = Math.min(walkDur, gap * 0.92);
          const idleDur = Math.max(0, gap - walkDur);

          if (idleDur > 0.01) {
            // Linger on the aisle (snap to nearest corridor node)
            const idleNode = NAV.nodes[nearestNav(pos)];
            out.push({
              type: 'idle',
              t0: gapStart,
              t1: gapStart + idleDur,
              pos: { x: idleNode.x, y: idleNode.y },
              color,
              tier: s.tier,
              player_id,
            });
          }
          if (walkDur > 0.012 && path.total > 8) {
            out.push({
              type: 'walk',
              t0: gapStart + idleDur,
              t1: start_h,
              path,
              color,
              tier: s.tier,
              player_id,
            });
          }
          pos = dest;
        }
      }
      return out;
    }

    // ---- canvas ----

      hover: null, heatMode: '60', tierFilter: 'all', focusPlayer: null,
    };
    const BUCKET_H = 5 / 60;
    const NB = Math.round(24 / BUCKET_H);
    let sessionBuckets = [];
    let walkerBuckets = [];

    let maxOccup = 1;

    function bucketOf(h) {
      return Math.max(0, Math.min(NB - 1, Math.floor(h / BUCKET_H)));
    }
    function indexTimeSpans(items, t0k, t1k) {
      const buckets = Array.from({ length: NB }, () => []);
      items.forEach((it, idx) => {
        const a = bucketOf(it[t0k]);
        const b = bucketOf(Math.max(it[t0k], it[t1k] - 1e-6));
        for (let i = a; i <= b; i++) buckets[i].push(idx);
      });
      return buckets;
    }
    function gather(buckets, items, t0, t1) {
      const seen = new Set();
      const out = [];
      const a = bucketOf(t0), b = bucketOf(t1);
      for (let i = a; i <= b; i++) {
        for (const idx of buckets[i]) {
          if (seen.has(idx)) continue;
          seen.add(idx);
          out.push(items[idx]);
        }
      }
      return out;
    }
    function passTier(tier) {
      if (ui.tierFilter === 'all') return true;
      if (ui.tierFilter === 'rated') return tier !== 'Member';

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const sw = stage.clientWidth, sh = stage.clientHeight;
      const tr = W / H, sr = sw / sh;
      let cw, ch;
      if (sr > tr) { ch = sh; cw = ch * tr; }
      else { cw = sw; ch = cw / tr; }
      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      canvas.width = Math.round(cw * dpr);
      canvas.height = Math.round(ch * dpr);
      ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
      drawSparkline();
    }
    window.addEventListener('resize', resize);

    function drawSparkline() {
      const spark = document.getElementById('scrubSpark');
      if (!spark || !occupCurve.length) return;
      const r = spark.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      spark.width = Math.max(1, Math.round(r.width * dpr));
      spark.height = Math.max(1, Math.round(r.height * dpr));
      const sctx = spark.getContext('2d');
      sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const w = r.width, h = r.height;
      sctx.clearRect(0, 0, w, h);
      sctx.beginPath();
      occupCurve.forEach((v, i) => {
        const x = (i / (occupCurve.length - 1)) * w;
        const y = h - 4 - (v / maxOccup) * (h - 10);
        if (i === 0) sctx.moveTo(x, y);
        else sctx.lineTo(x, y);
      });
      sctx.strokeStyle = 'rgba(167,139,250,0.7)';
      sctx.lineWidth = 1.4;
      sctx.stroke();
      sctx.lineTo(w, h);
      sctx.lineTo(0, h);
      sctx.closePath();
      sctx.fillStyle = 'rgba(108,92,231,0.18)';
      sctx.fill();
    }

    function setFocusPlayer(pid) {
      ui.focusPlayer = pid || null;

        const dest = approachForMachine(m);

    function renderInspect() {

      box.innerHTML = `<h3>${ui.focusPlayer} · ${legs[0].tier}</h3>

          return `<div class="leg" style="${now ? 'color:#f8e7b0' : ''}">${i + 1}. ${fmtH(s.start_h)} → ${s.bank} ${s.theme} · ${money(s.coin_in)}${s.jackpot > 0 ? ' ★' : ''}${now ? ' · now' : ''}</div>`;
        }).join('')}

    // ---- floor drawing (from classic viz) ----
    function drawAisles() {
      // Wide X bands (classic CAD diagonals)
      const stripeWidth = 52;
      ctx.fillStyle = 'rgba(255, 240, 220, 0.045)';
      for (const a of AISLES) {
        const dx = a.x2 - a.x1, dy = a.y2 - a.y1;
        const len = Math.hypot(dx, dy);
        const nx = -dy / len, ny = dx / len;
        const w = stripeWidth / 2;
        ctx.beginPath();
        ctx.moveTo(a.x1 + nx * w, a.y1 + ny * w);
        ctx.lineTo(a.x2 + nx * w, a.y2 + ny * w);
        ctx.lineTo(a.x2 - nx * w, a.y2 - ny * w);
        ctx.lineTo(a.x1 - nx * w, a.y1 - ny * w);
        ctx.closePath();
        ctx.fill();
      }
      // Full corridor network (walkable map)
      if (!ui.showAisles) return;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      // soft fill under corridor lines
      ctx.strokeStyle = 'rgba(180, 200, 240, 0.16)';
      ctx.lineWidth = 16;
      for (const c of CORRIDORS) {
        if (!c.pts || c.pts.length < 2) continue;
        if (String(c.id).startsWith('sp')) continue; // spurs thinner
        ctx.beginPath();
        ctx.moveTo(c.pts[0][0], c.pts[0][1]);
        for (let i = 1; i < c.pts.length; i++) ctx.lineTo(c.pts[i][0], c.pts[i][1]);
        ctx.stroke();
      }
      // centerlines
      ctx.strokeStyle = 'rgba(200, 220, 255, 0.42)';
      ctx.lineWidth = 1.4;
      ctx.setLineDash([5, 4]);
      for (const c of CORRIDORS) {
        if (!c.pts || c.pts.length < 2) continue;
        ctx.beginPath();
        ctx.moveTo(c.pts[0][0], c.pts[0][1]);
        for (let i = 1; i < c.pts.length; i++) ctx.lineTo(c.pts[i][0], c.pts[i][1]);
        ctx.stroke();
      }
      ctx.setLineDash([]);
      // bank spur stubs
      ctx.strokeStyle = 'rgba(200, 220, 255, 0.18)';
      ctx.lineWidth = 1;
      for (const c of CORRIDORS) {
        if (!String(c.id).startsWith('sp') || c.pts.length < 2) continue;
        ctx.beginPath();
        ctx.moveTo(c.pts[0][0], c.pts[0][1]);
        ctx.lineTo(c.pts[1][0], c.pts[1][1]);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawOuter() {

      ctx.moveTo(x0, y0); ctx.lineTo(ENTRANCE.x0, y0);
      ctx.moveTo(ENTRANCE.x1, y0); ctx.lineTo(x1, y0);
      ctx.moveTo(x1, y0); ctx.lineTo(x1, y1);
      ctx.moveTo(x1, y1); ctx.lineTo(x0, y1);
      ctx.moveTo(x0, y1); ctx.lineTo(x0, y0);
      ctx.stroke();
      ctx.fillStyle = 'rgba(200, 155, 60, 0.85)';
      ctx.font = '700 11px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText('▼  ENTRANCE  ▼', (ENTRANCE.x0 + ENTRANCE.x1) / 2, y0 - 4);
    }
    function drawBankBg(b) {
      const own = machinesByBank[b.id];
      if (!own || !own.length) return;
      const pad = 12;
      if (b.kind === 'linear' && (b.angle || 0) !== 0) {
        ctx.save();
        ctx.translate(b.cx, b.cy);
        ctx.rotate(b.angle);
        const halfW = ((b.cols - 1) * b.sx) / 2 + pad;
        const halfH = ((b.rows - 1) * b.sy) / 2 + pad + 4;
        ctx.fillStyle = b.hl ? 'rgba(200, 155, 60, 0.06)' : 'rgba(108, 92, 231, 0.06)';
        roundRect(ctx, -halfW, -halfH, halfW * 2, halfH * 2, 10);
        ctx.fill();
        ctx.strokeStyle = b.hl ? 'rgba(200, 155, 60, 0.35)' : 'rgba(108, 92, 231, 0.20)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
      } else {
        const minX = Math.min(...own.map(m => m.x)) - pad;
        const minY = Math.min(...own.map(m => m.y)) - pad;
        const maxX = Math.max(...own.map(m => m.x)) + pad;
        const maxY = Math.max(...own.map(m => m.y)) + pad;
        ctx.fillStyle = b.hl ? 'rgba(200, 155, 60, 0.06)' : 'rgba(108, 92, 231, 0.06)';
        roundRect(ctx, minX, minY, maxX - minX, maxY - minY, 10);
        ctx.fill();
        ctx.strokeStyle = b.hl ? 'rgba(200, 155, 60, 0.35)' : 'rgba(108, 92, 231, 0.20)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      if (!b.hl) {
        ctx.fillStyle = 'rgba(176, 167, 207, 0.9)';
        ctx.font = '700 10px system-ui, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'bottom';
        const minX2 = Math.min(...own.map(m => m.x)) - 12;
        const minY2 = Math.min(...own.map(m => m.y)) - 12;
        const tx = b.kind === 'carousel' ? (b.cx - b.r) : minX2 + 2;
        const ty = b.kind === 'carousel' ? (b.cy - b.r - 4) : minY2 - 2;
        ctx.fillText(b.id + ' · ' + b.label, tx, ty);
      }
    }
    function ambientCarpet(h) {
      if (h < 6) return ['#0a0910', '#1a1730'];
      if (h < 11) return ['#0c0a14', '#221c36'];
      if (h < 16) return ['#0e0b16', '#261e3a'];
      if (h < 19) return ['#120e16', '#2e2238'];
      return ['#160e12', '#3a2430'];
    }
    function drawFloor() {
      const [voidC, carpet] = ambientCarpet(time.sim_h);
      ctx.fillStyle = voidC;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = carpet;
      ctx.fillRect(WALL, WALL, W - 2 * WALL, H - 2 * WALL);
      ctx.fillStyle = 'rgba(200, 155, 60, 0.035)';
      for (let yy = WALL + 14; yy < H - WALL; yy += 32) {
        const off = ((yy / 32) | 0) % 2 === 0 ? 0 : 16;
        for (let xx = WALL + 14 + off; xx < W - WALL; xx += 32) {
          ctx.beginPath();
          ctx.arc(xx, yy, 1.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      drawAisles();
      for (const r of ROOMS) drawRoom(r);
      drawPit();
      drawHL();
      drawOuter();
      drawCrossroads();
      for (const b of BANKS) drawBankBg(b);
      const vg = ctx.createRadialGradient(W * 0.5, H * 0.48, 280, W * 0.5, H * 0.5, 860);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(0,0,0,0.28)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }

    // ---- frame state ----
    function computeFrame(t_h) {
      const live = [];
      const occupied = new Map();
      const heat = new Map();
      const bankHeat = {};
      const zoneOcc = Object.fromEntries(ZONES.map(z => [z, 0]));
      const zoneCap = Object.fromEntries(ZONES.map(z => [z, machines.filter(m => m.zone === z).length]));
      const tierCounts = Object.fromEntries(TIERS.map(t => [t, 0]));
      let coinLive = 0, theoLive = 0, actualLive = 0, coin60 = 0;
      const tLo = ui.heatMode === 'day' ? 0 : Math.max(0, t_h - HEAT_WINDOW_H);

      for (const s of gather(sessionBuckets, sessions, tLo, t_h)) {
        const a = s.start_h, b = s.end_h;
        if (a <= t_h && t_h < b && passTier(s.tier)) {
          live.push(s);
          occupied.set(s.asset_id, s);
          coinLive += s.coin_in;
          theoLive += s.theo_win;
          actualLive += s.actual_win;
          tierCounts[s.tier] = (tierCounts[s.tier] || 0) + 1;
          zoneOcc[s.zone] = (zoneOcc[s.zone] || 0) + 1;
        }
        if (b > tLo && a < t_h && passTier(s.tier)) {
          const overlap = Math.min(b, t_h) - Math.max(a, tLo);
          const dur = Math.max(1 / 60, b - a);
          const portion = (s.coin_in * overlap) / dur;
          heat.set(s.asset_id, (heat.get(s.asset_id) || 0) + portion);
          bankHeat[s.bank] = (bankHeat[s.bank] || 0) + portion;
          coin60 += portion;
        }
      }

      const walking = [];
      if (ui.showWalk) {
        const tPulse = performance.now() / 1000;
        for (const w of gather(walkerBuckets, walkers, t_h, t_h)) {
          if (t_h < w.t0 || t_h >= w.t1) continue;
          if (!passTier(w.tier)) continue;
          if (w.type === 'idle') {
            const sway = 3.2;
            const ph = (tPulse + (w.player_id || '').length) * 0.7;
            walking.push({
              mode: 'idle', player_id: w.player_id, tier: w.tier,
              pos: { x: w.pos.x + Math.sin(ph) * sway, y: w.pos.y + Math.cos(ph * 0.85) * sway },
              color: w.color, path: null, frac: 0,
            });
          } else {
            const f = (t_h - w.t0) / Math.max(1e-6, w.t1 - w.t0);
            walking.push({
              mode: 'walk', player_id: w.player_id, tier: w.tier,
              pos: positionOnPath(w.path, f), color: w.color, path: w.path, frac: f,
            });
          }
        }
      }

      maxHeat = 1;
      for (const v of heat.values()) if (v > maxHeat) maxHeat = v;

      const hotBanks = Object.entries(bankHeat)
        .map(([id, amt]) => ({ id, amt, b: BANK_MAP[id] }))
        .filter(x => x.b)
        .sort((a, b) => b.amt - a.amt)
        .slice(0, 5);

      const liveStories = stories.filter(st => t_h >= st.at_h && t_h < st.end_h);

      const whales = live.slice().sort((a, b) => b.coin_in - a.coin_in).slice(0, 5);
      const hold = coinLive > 0 ? actualLive / coinLive : 0;
      const theoHold = coinLive > 0 ? theoLive / coinLive : 0;

      return {
        live, occupied, heat, walking, tierCounts, zoneOcc, zoneCap,
        coinLive, theoLive, actualLive, coin60, hold, theoHold,
        hotBanks, liveStories, whales,
      };
    }

    function drawHeat(heat) {
      if (!ui.showHeat) return;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const m of machines) {
        const v = heat.get(m.asset_id) || 0;
        if (v < 1) continue;
        const t = Math.min(1, Math.pow(v / maxHeat, 0.45));
        const r = 18 + t * 38;
        const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, r);
        const base = heatColor(t);
        g.addColorStop(0, base + (0.28 + t * 0.55) + ')');
        g.addColorStop(0.45, base + (0.12 + t * 0.22) + ')');
        g.addColorStop(1, base + '0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(m.x, m.y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawMachines(occupied) {
      for (const m of machines) {
        const sess = occupied.get(m.asset_id);
        const hl = m.hl;
        const size = hl ? 12 : 9;
        const focused = ui.focusPlayer && sess && sess.player_id === ui.focusPlayer;

        if (sess) {
          const col = TIER_COLOR[sess.tier] || '#fbbf24';
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          const glowR = size + (focused ? 28 : 20);
          const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, glowR);
          g.addColorStop(0, col);
          g.addColorStop(0.25, col + 'cc');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(m.x, m.y, glowR, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          ctx.fillStyle = '#1a1420';
          roundRect(ctx, m.x - size * 0.55, m.y - size * 0.72, size * 1.1, size * 1.44, 2.5);
          ctx.fill();
          ctx.fillStyle = col;
          roundRect(ctx, m.x - size * 0.42, m.y - size * 0.55, size * 0.84, size * 0.7, 1.5);
          ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.85)';
          ctx.beginPath();
          ctx.arc(m.x, m.y - size * 0.18, 1.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fbbf24';
          ctx.fillRect(m.x - size * 0.18, m.y + size * 0.32, size * 0.36, 1.6);
        } else {
          ctx.fillStyle = hl ? 'rgba(200,155,60,0.22)' : 'rgba(80,70,120,0.28)';
          roundRect(ctx, m.x - size * 0.5, m.y - size * 0.65, size, size * 1.3, 2);
          ctx.fill();
          ctx.strokeStyle = hl ? 'rgba(200,155,60,0.5)' : 'rgba(167,139,250,0.28)';
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.fillStyle = hl ? 'rgba(251,191,36,0.12)' : 'rgba(255,255,255,0.06)';
          roundRect(ctx, m.x - size * 0.32, m.y - size * 0.42, size * 0.64, size * 0.5, 1);
          ctx.fill();
        }

        if (ui.showIds) {
          ctx.fillStyle = 'rgba(255,255,255,0.45)';
          ctx.font = '600 7px ui-monospace, monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          ctx.fillText(m.asset_id.replace('EGM-', ''), m.x, m.y + size);
        }
      }
    }

    function drawWalkers(walking) {
      for (const w of walking) {
        // Ghost of remaining route (aisle polyline)
        if (ui.showRoute && w.mode === 'walk' && w.path && w.path.points.length > 1) {
          ctx.save();
          ctx.strokeStyle = w.color;
          ctx.globalAlpha = 0.18;
          ctx.lineWidth = 1.5;
          ctx.setLineDash([4, 5]);
          ctx.beginPath();
          // draw from current progress onward
          const startFrac = w.frac;
          let drawn = false;
          let acc = 0;
          for (let i = 0; i < w.path.segs.length; i++) {
            const segEnd = (acc + w.path.segs[i]) / w.path.total;
            const a = w.path.points[i], b = w.path.points[i + 1];
            if (segEnd < startFrac) { acc += w.path.segs[i]; continue; }
            let ax = a.x, ay = a.y;
            if (acc / w.path.total < startFrac) {
              const t = (startFrac * w.path.total - acc) / w.path.segs[i];
              ax = a.x + (b.x - a.x) * t;
              ay = a.y + (b.y - a.y) * t;
            }
            if (!drawn) { ctx.moveTo(ax, ay); drawn = true; }
            else ctx.lineTo(ax, ay);
            ctx.lineTo(b.x, b.y);
            acc += w.path.segs[i];
          }
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.restore();
        }

        // Person avatar — soft halo, no comet trail
        const r = w.mode === 'idle' ? 4.2 : 4.8;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createRadialGradient(w.pos.x, w.pos.y, 0, w.pos.x, w.pos.y, r * 3.2);
        g.addColorStop(0, w.color);
        g.addColorStop(0.45, w.color + '55');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(w.pos.x, w.pos.y, r * 3.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        const focused = ui.focusPlayer && w.player_id === ui.focusPlayer;
        ctx.fillStyle = w.color;
        ctx.beginPath();
        ctx.arc(w.pos.x, w.pos.y, focused ? r + 1.4 : r, 0, Math.PI * 2);
        ctx.fill();
        if (focused) {
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(w.pos.x, w.pos.y, r + 6, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.arc(w.pos.x, w.pos.y, r * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        if (w.mode === 'idle') {
          ctx.strokeStyle = w.color;
          ctx.globalAlpha = 0.35;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(w.pos.x, w.pos.y, r + 3, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }
    }

    function drawFocusJourney(t_h) {
      if (!ui.focusPlayer || !focusCache) return;
      const { legs, routes } = focusCache;
      if (!legs.length) return;
      ctx.save();
      ctx.fillStyle = 'rgba(7,6,11,0.38)';
      ctx.fillRect(WALL, WALL, W - 2 * WALL, H - 2 * WALL);
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = 'rgba(248,231,176,0.55)';
      ctx.lineWidth = 2.2;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.setLineDash([3, 5]);
      ctx.beginPath();
      let started = false;
      for (const r of routes) {
        for (const p of r.path.points) {
          if (!started) { ctx.moveTo(p.x, p.y); started = true; }
          else ctx.lineTo(p.x, p.y);
        }
      }
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      routes.forEach((r, i) => {
        const m = r.machine;
        const s = r.session;
        const now = s.start_h <= t_h && t_h < s.end_h;
        ctx.beginPath();
        ctx.fillStyle = now ? TIER_COLOR[s.tier] : 'rgba(248,231,176,0.35)';
        ctx.arc(m.x, m.y, now ? 8 : 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = now ? '#fff' : 'rgba(248,231,176,0.8)';
        ctx.font = '700 9px IBM Plex Mono, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(String(i + 1), m.x, m.y - 10);
      });
    }

    function drawJackpotRings(t_h) {
      for (const s of jackpotSessions) {
        const at = s.start_h;
        const age = t_h - at;
        if (age < 0 || age > 0.45) continue;
        const m = machineById[s.asset_id];
        if (!m) continue;
        const i = 1 - age / 0.45;
        const r = 8 + (1 - i) * 50;
        ctx.strokeStyle = `rgba(251,191,36,${0.15 + i * 0.7})`;
        ctx.lineWidth = 2 + i * 2;
        ctx.beginPath();
        ctx.arc(m.x, m.y, r, 0, Math.PI * 2);
        ctx.stroke();
        if (age < 0.2) {
          ctx.fillStyle = `rgba(255,234,130,${i})`;
          ctx.font = '900 13px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillText('★ ' + money(s.jackpot), m.x, m.y - r - 4);
        }
      }
    }

    function placeCallout(story, t_h) {
      if (!story) {
        calloutEl.classList.remove('on');
        return;
      }
      let ax, ay;
      if (story.asset_id && machineById[story.asset_id]) {
        ax = machineById[story.asset_id].x;
        ay = machineById[story.asset_id].y;
      } else if (story.anchor) {
        ax = story.anchor.x;
        ay = story.anchor.y;
      } else {
        calloutEl.classList.remove('on');
        return;
      }
      const sR = stage.getBoundingClientRect();
      const cR = canvas.getBoundingClientRect();
      calloutEl.style.left = (cR.left - sR.left + (ax / W) * cR.width) + 'px';
      calloutEl.style.top = (cR.top - sR.top + (ay / H) * cR.height) + 'px';
      calloutEl.innerHTML = `<b>${story.title}</b><div class="sub">${story.desc}</div>`;
      calloutEl.classList.add('on');
    }

    // ---- HUD ----
    let hudThrottle = 0;
    function updateHUD(frame, t_h) {
      document.getElementById('clock').textContent = fmtH(t_h);
      document.getElementById('period').textContent = periodLabel(t_h);
      const pct = (t_h / 24) * 100;
      document.getElementById('scrubFill').style.width = pct + '%';
      document.getElementById('scrubKnob').style.left = pct + '%';

      const now = performance.now();
      if (now - hudThrottle < 100) return;
      hudThrottle = now;

      document.getElementById('kpiPlayers').textContent = frame.live.length;
      document.getElementById('kpiMachines').textContent = frame.occupied.size + ' / ' + machines.length;
      document.getElementById('kpiCoinLive').textContent = money(frame.coinLive);
      document.getElementById('kpiTheoLive').textContent = money(frame.theoLive);
      document.getElementById('kpiHold').textContent =
        (frame.hold * 100).toFixed(1) + '% vs ' + (frame.theoHold * 100).toFixed(1) + '% theo';
      document.getElementById('kpiCoin60').textContent = money(frame.coin60);
      document.getElementById('kpiWalk').textContent = frame.walking.length;

      document.getElementById('zoneList').innerHTML = ZONES.map(z => {
        const n = frame.zoneOcc[z] || 0;
        const cap = frame.zoneCap[z] || 1;
        const pctZ = Math.min(100, (n / cap) * 100);
        return `<div class="zone-row"><span>${ZONE_LABEL[z]}</span><span class="bar"><i style="width:${pctZ}%"></i></span><span>${n}</span></div>`;
      }).join('');

      document.getElementById('whaleList').innerHTML = frame.whales.length
        ? frame.whales.map(s =>
          `<div class="bank-row" data-player="${s.player_id}" style="cursor:pointer">
            <span><span class="id">${s.player_id}</span> <span class="lbl">${s.tier} · ${s.bank}</span></span>
            <span class="amt">${money(s.coin_in)}</span>
          </div>`).join('')
        : `<div class="bank-row"><span class="lbl">— no rated play —</span></div>`;

      document.getElementById('hotBanks').innerHTML = frame.hotBanks.length
        ? frame.hotBanks.map(e =>
          `<div class="bank-row">
            <span><span class="id">${e.id}</span> <span class="lbl">${e.b.label}</span></span>
            <span class="amt">${money(e.amt)}</span>
          </div>`).join('')
        : `<div class="bank-row"><span class="lbl">— quiet hour —</span></div>`;

      document.getElementById('tierList').innerHTML = TIERS.map(t =>
        `<div class="kpi"><span class="label" style="color:${TIER_COLOR[t]}">${t}</span>
         <span class="val dim">${frame.tierCounts[t] || 0}</span></div>`
      ).join('');

      stories.forEach((st, i) => {
        const el = document.getElementById('event-' + i);
        if (!el) return;
        el.classList.toggle('live', t_h >= st.at_h && t_h < st.end_h);
        el.classList.toggle('past', t_h >= st.end_h);
      });

      placeCallout(frame.liveStories[0] || null, t_h);
      if (ui.focusPlayer) renderInspect();
    }

    // ---- hit test ----
    function clientToLogical(cx, cy) {
      const r = canvas.getBoundingClientRect();
      return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H };
    }
    function hitTest(px, py) {
      let best = null, bestD2 = Infinity;
      for (const m of machines) {
        const dx = m.x - px, dy = m.y - py;
        const d2 = dx * dx + dy * dy;
        const rr = m.hl ? 12 : 10;
        if (d2 < rr * rr && d2 < bestD2) { bestD2 = d2; best = m; }
      }
      return best;
    }

    let lastOccupied = new Map();
    let lastHeat = new Map();

    canvas.addEventListener('mousemove', (e) => {
      const p = clientToLogical(e.clientX, e.clientY);
      const m = hitTest(p.x, p.y);
      ui.hover = m;
      if (m) {
        canvas.style.cursor = 'pointer';
        const sR = stage.getBoundingClientRect();
        const cR = canvas.getBoundingClientRect();
        tooltip.style.left = (cR.left - sR.left + (m.x / W) * cR.width) + 'px';
        tooltip.style.top = (cR.top - sR.top + (m.y / H) * cR.height) + 'px';
        const sess = lastOccupied.get(m.asset_id);
        const heatV = lastHeat.get(m.asset_id) || 0;
        let html = `<b>${m.asset_id}</b> · ${m.bank} ${m.theme}` +
          (m.hl ? ' · HL' : '') +
          `<br><code>denom $${m.denom} · par ${(m.par * 100).toFixed(1)}%</code>`;
        if (sess) {
          html += `<br><b style="color:#fbbf24">PLAYING</b> · ${sess.tier}` +
            `<br>coin-in ${money(sess.coin_in)} · theo ${money(sess.theo_win)}` +
            (sess.jackpot > 0 ? `<br>★ jackpot ${money(sess.jackpot)}` : '');
        } else {
          html += '<br>idle';
        }
        if (ui.showHeat && heatV > 0) {
          html += `<br>heat ${ui.heatMode === 'day' ? 'day' : '60m'}: ${money(heatV)}`;
        }
        html += '<br><span style="color:#8c87a4">click to follow player</span>';
        tooltip.innerHTML = html;
        tooltip.classList.add('is-on');
      } else {
        canvas.style.cursor = 'crosshair';
        tooltip.classList.remove('is-on');
      }
    });
    canvas.addEventListener('mouseleave', () => {
      ui.hover = null;
      tooltip.classList.remove('is-on');
    });
    canvas.addEventListener('click', (e) => {
      const p = clientToLogical(e.clientX, e.clientY);
      const m = hitTest(p.x, p.y);
      if (m) {
        const sess = lastOccupied.get(m.asset_id);
        if (sess) { setFocusPlayer(sess.player_id); return; }
      }
      let best = null, bestD2 = 14 * 14;
      for (const w of lastWalking) {
        const d2 = (w.pos.x - p.x) ** 2 + (w.pos.y - p.y) ** 2;
        if (d2 < bestD2) { bestD2 = d2; best = w; }
      }
      if (best) setFocusPlayer(best.player_id);
      else setFocusPlayer(null);
    });

    // ---- controls ----
    document.getElementById('playBtn').addEventListener('click', () => {
      time.playing = !time.playing;
      document.getElementById('playBtn').textContent = time.playing ? '⏸' : '▶';
    });
    document.getElementById('rewindBtn').addEventListener('click', () => { time.sim_h = 0; });
    document.querySelectorAll('#speedGroup button').forEach(b => {
      b.addEventListener('click', () => {
        time.speed = +b.dataset.speed;
        document.querySelectorAll('#speedGroup button').forEach(x => x.classList.toggle('active', x === b));
      });
    });
    document.querySelectorAll('.story button').forEach(b => {
      b.addEventListener('click', () => {
        time.sim_h = +b.dataset.jump;
        time.playing = false;
        document.getElementById('playBtn').textContent = '▶';
      });
    });
    document.getElementById('showHeat').addEventListener('change', e => { ui.showHeat = e.target.checked; });
    document.getElementById('showWalk').addEventListener('change', e => { ui.showWalk = e.target.checked; });
    document.getElementById('showAisles').addEventListener('change', e => { ui.showAisles = e.target.checked; });
    document.getElementById('showRoute').addEventListener('change', e => { ui.showRoute = e.target.checked; });
    document.getElementById('showIds').addEventListener('change', e => { ui.showIds = e.target.checked; });
    document.getElementById('heatMode').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-heat]');
      if (!btn) return;
      ui.heatMode = btn.dataset.heat;
      document.querySelectorAll('#heatMode .chip').forEach(c => c.classList.toggle('on', c === btn));
    });
    document.getElementById('tierFilter').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-tier]');
      if (!btn) return;
      ui.tierFilter = btn.dataset.tier;
      document.querySelectorAll('#tierFilter .chip').forEach(c => c.classList.toggle('on', c === btn));
    });
    document.getElementById('whaleList').addEventListener('click', (e) => {
      const row = e.target.closest('[data-player]');
      if (row) setFocusPlayer(row.dataset.player);
    });

    const scrub = document.getElementById('scrub');
    let scrubbing = false;
    function scrubFromEvent(e) {
      const r = scrub.getBoundingClientRect();
      const x = Math.max(0, Math.min(r.width, (e.clientX || e.touches[0].clientX) - r.left));
      time.sim_h = (x / r.width) * 24;
    }
    scrub.addEventListener('mousedown', e => { scrubbing = true; scrubFromEvent(e); });
    window.addEventListener('mousemove', e => { if (scrubbing) scrubFromEvent(e); });
    window.addEventListener('mouseup', () => { scrubbing = false; });

    // scrub hours
    document.getElementById('scrubHours').innerHTML = Array.from({ length: 24 }, (_, h) =>
      `<span>${h % 6 === 0 ? String(h).padStart(2, '0') : ''}</span>`
    ).join('');

    // ---- loop ----
    let lastStageW = 0, lastStageH = 0;
    function frame(ts) {
      if (!time.lastTs) time.lastTs = ts;
      const dt = (ts - time.lastTs) / 1000;
      time.lastTs = ts;
      if (time.playing && !scrubbing) {
        time.sim_h += (dt * time.speed) / 3600;
        if (time.sim_h >= 24) time.sim_h -= 24;
      }
      const sw = stage.clientWidth, sh = stage.clientHeight;
      if (sw !== lastStageW || sh !== lastStageH) {
        lastStageW = sw; lastStageH = sh;
        resize();
      }

      const f = computeFrame(time.sim_h);
      lastOccupied = f.occupied;
      lastHeat = f.heat;
      lastWalking = f.walking;

      drawFloor();
      drawHeat(f.heat);
      drawMachines(f.occupied);
      drawWalkers(f.walking);
      drawFocusJourney(time.sim_h);
      drawJackpotRings(time.sim_h);
      if (ui.hover) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(ui.hover.x, ui.hover.y, (ui.hover.hl ? 9 : 7) + 5, 0, Math.PI * 2);
        ctx.stroke();
      }

      updateHUD(f, time.sim_h);
      requestAnimationFrame(frame);
    }

    async function init() {
      try {
        const [mRes, sRes, cRes] = await Promise.all([
          fetch('data/machines.json'),
          fetch('data/sessions.json'),
          fetch('data/corridors.json'),
        ]);
        if (!mRes.ok || !sRes.ok || !cRes.ok) throw new Error('Could not load floor data. Try refreshing.');
        machines = await mRes.json();
        sessions = await sRes.json();
        sessions.forEach(s => {
          s.start_h = parseHours(s.start_dt);
          s.end_h = parseHours(s.end_dt);
        });
        const corridorData = await cRes.json();
        CORRIDORS = corridorData.corridors || [];
        BANK_APPROACH = corridorData.bank_approach || {};
        NAV = buildNavGraph(CORRIDORS);
        machineById = Object.fromEntries(machines.map(m => [m.asset_id, m]));
        machinesByBank = {};
        machines.forEach(m => {
          (machinesByBank[m.bank] = machinesByBank[m.bank] || []).push(m);
        });
        walkers = buildWalkers(sessions);
        stories = buildStories(sessions);
        jackpotSessions = sessions.filter(s => s.jackpot > 0);
        sessionBuckets = indexTimeSpans(sessions, 'start_h', 'end_h');
        walkerBuckets = indexTimeSpans(walkers, 't0', 't1');
        occupCurve = sessionBuckets.map((idxs, i) => {
          const t = i * BUCKET_H;
          let n = 0;
          for (const idx of idxs) {
            const s = sessions[idx];
            if (s.start_h <= t && t < s.end_h) n++;
          }
          return n;
        });
        maxOccup = Math.max(1, ...occupCurve);

        document.getElementById('meta').textContent =
          machines.length + ' EGMs · ' + sessions.length.toLocaleString() + ' ratings · ' +
          CORRIDORS.length + ' aisles · Thu 21 May 2026';

        // scrub event ticks + HUD story list
        const scrubEvents = document.getElementById('scrubEvents');
        scrubEvents.innerHTML = '';
        stories.forEach(st => {
          const i = document.createElement('i');
          i.style.left = ((st.at_h / 24) * 100) + '%';
          i.title = st.title;
          scrubEvents.appendChild(i);
        });
        document.getElementById('eventsList').innerHTML = stories.map((st, i) =>
          `<div class="event" id="event-${i}" data-jump="${st.jump}">
            <time>${fmtH(st.at_h)}</time>
            <span class="desc"><b style="color:#fbbf24">${st.title}</b><br>${st.desc}</span>
          </div>`
        ).join('');
        document.querySelectorAll('#eventsList .event').forEach(el => {
          el.addEventListener('click', () => {
            time.sim_h = +el.dataset.jump;
            time.playing = false;
            document.getElementById('playBtn').textContent = '▶';
          });
        });

        document.getElementById('loadMsg').hidden = true;
        window.casinoFlow = { machines, sessions, stories, corridors: CORRIDORS, nav: NAV, time, fmtH };
        resize();
        requestAnimationFrame(frame);
      } catch (e) {
        const el = document.getElementById('loadMsg');
        el.classList.add('err');
        el.textContent = e.message || String(e);
      }
    }
    init();
  </script>
</body>
</html>
