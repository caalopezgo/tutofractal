<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mandelbrot · Deep Stills · TutoFractal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #07080b;
      --foam: #e7ebe4;
      --muted: rgba(231, 235, 228, 0.55);
      --line: rgba(231, 235, 228, 0.14);
      --ember: #d4784a;
      --moss: #6f9a7a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background:
        radial-gradient(ellipse 90% 60% at 50% -10%, rgba(80, 60, 40, 0.35), transparent 55%),
        radial-gradient(ellipse 70% 50% at 80% 100%, rgba(40, 70, 65, 0.25), transparent 50%),
        var(--ink);
      color: var(--foam);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      overflow-x: hidden;
    }

    /* film grain overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0.07;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
      animation: grain 0.5s steps(2) infinite;
    }

    @keyframes grain {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-1%, 1%); }
      50% { transform: translate(1%, -1%); }
      75% { transform: translate(-1%, -1%); }
    }

    .hero {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(1.25rem, 3vw, 2.5rem);
      position: relative;
      isolation: isolate;
    }

    .hero-media {
      position: absolute;
      inset: 0;
      z-index: -1;
      overflow: hidden;
    }

    .hero-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.08);
      animation: drift 28s ease-in-out infinite alternate;
      filter: saturate(1.1) contrast(1.05);
    }

    @keyframes drift {
      from { transform: scale(1.08) translate(0, 0); }
      to { transform: scale(1.14) translate(-1.5%, 1%); }
    }

    .hero-media::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(7, 8, 11, 0.55), transparent 28%, transparent 55%, rgba(7, 8, 11, 0.92)),
        radial-gradient(ellipse at center, transparent 30%, rgba(7, 8, 11, 0.55) 100%);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      position: relative;
      z-index: 1;
    }

    .brand {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(2.6rem, 7vw, 5.5rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 0.92;
      text-shadow: 0 4px 40px rgba(0, 0, 0, 0.55);
    }

    .brand em {
      font-style: italic;
      font-weight: 400;
      color: var(--ember);
    }

    .meta {
      text-align: right;
      font-size: 0.72rem;
      line-height: 1.6;
      color: var(--muted);
      max-width: 14rem;
    }

    .hero-copy {
      align-self: end;
      max-width: 28rem;
      position: relative;
      z-index: 1;
      padding-bottom: 0.5rem;
    }

    .hero-copy p {
      font-size: clamp(0.95rem, 1.6vw, 1.1rem);
      line-height: 1.55;
      color: rgba(231, 235, 228, 0.82);
      margin-bottom: 1.25rem;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--foam);
      text-decoration: none;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(212, 120, 74, 0.7);
      padding-bottom: 0.25rem;
      transition: color 0.2s, border-color 0.2s;
    }

    .cta:hover { color: var(--ember); border-color: var(--ember); }

    .strip {
      display: flex;
      gap: 0.75rem;
      overflow-x: auto;
      padding: 0.5rem 0 0;
      scrollbar-width: none;
      position: relative;
      z-index: 1;
    }

    .strip::-webkit-scrollbar { display: none; }

    .strip button {
      flex: 0 0 auto;
      width: 4.5rem;
      height: 3rem;
      border: 1px solid var(--line);
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      background: #000;
      opacity: 0.7;
      transition: opacity 0.25s, border-color 0.25s, transform 0.25s;
    }

    .strip button:hover,
    .strip button.active {
      opacity: 1;
      border-color: rgba(212, 120, 74, 0.8);
      transform: translateY(-2px);
    }

    .strip img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gallery {
      padding: clamp(2rem, 6vw, 5rem) clamp(1.25rem, 3vw, 2.5rem) 6rem;
      display: flex;
      flex-direction: column;
      gap: clamp(4rem, 12vh, 8rem);
    }

    .piece {
      display: grid;
      gap: 1rem;
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .piece.in {
      opacity: 1;
      transform: none;
    }

    .piece-frame {
      position: relative;
      overflow: hidden;
      cursor: zoom-in;
      background: #000;
      aspect-ratio: 16 / 9;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
    }

    .piece-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      mix-blend-mode: soft-light;
      opacity: 0.45;
      background: var(--wash, transparent);
      transition: opacity 0.4s;
    }

    .piece-frame:hover::after { opacity: 0.25; }

    .piece-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.02);
      transition: transform 1.2s ease;
      filter: var(--grade, none);
    }

    .piece-frame:hover img { transform: scale(1.06); }

    .piece-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .piece-title {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .piece-note {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .piece[data-look="ember"] { --wash: linear-gradient(135deg, #d4784a, #2a1810); }
    .piece[data-look="ice"] { --wash: linear-gradient(135deg, #7eb8b0, #142028); }
    .piece[data-look="nocturne"] { --wash: linear-gradient(135deg, #8fad78, #121810); }
    .piece[data-look="rust"] { --wash: linear-gradient(135deg, #c45c3a, #1a100c); }
    .piece[data-look="abyssal"] { --wash: linear-gradient(135deg, #5a8f9a, #101418); }

    /* lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(5, 6, 8, 0.94);
      display: grid;
      place-items: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox img {
      max-width: min(96vw, 1600px);
      max-height: 88vh;
      object-fit: contain;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
      transform: scale(0.96);
      transition: transform 0.4s ease;
    }

    .lightbox.open img { transform: scale(1); }

    .lightbox-cap {
      position: absolute;
      left: 1.5rem;
      bottom: 1.5rem;
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.25rem;
    }

    .lightbox-close {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--foam);
      font: inherit;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.55rem 0.8rem;
      cursor: pointer;
    }

    .lightbox-close:hover { border-color: var(--ember); color: var(--ember); }

    footer {
      padding: 0 clamp(1.25rem, 3vw, 2.5rem) 2.5rem;
      font-size: 0.7rem;
      color: var(--muted);
    }

    footer a { color: var(--foam); }
  </style>
</head>
<body>
  <header class="hero" id="top">
    <div class="hero-media">
      <img id="hero-img" src="styled/seahorse_deep.png" alt="" />
    </div>
    <div class="top">
      <div class="brand">Mandelbrot<br /><em>stills</em></div>
      <div class="meta">
        ocho recortes del conjunto<br />
        con grain, viñeta y grade<br />
        sin zoom infinito — solo look
      </div>
    </div>
    <div class="hero-copy">
      <p>Fotografías del plano complejo. Cada una con su propia temperatura de color y atmósfera.</p>
      <a class="cta" href="#gallery">Ver la serie ↓</a>
    </div>
    <div class="strip" id="strip" aria-label="Vista previa"></div>
  </header>

  <main class="gallery" id="gallery"></main>

  <footer>
    8 destinos ·
    <a href="zoom.html">zoom vivo</a> ·
    <a href="../visual.html">site</a>
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" hidden>
    <button class="lightbox-close" type="button" id="lb-close">Cerrar</button>
    <img id="lb-img" alt="" />
    <div class="lightbox-cap" id="lb-cap"></div>
  </div>

  <script>
    const PIECES = [
      { id: "seahorse_deep", title: "Caballito cercano", note: "ember · deep crop", look: "ember" },
      { id: "seahorse", title: "Valle del caballito", note: "ember · valley", look: "ember" },
      { id: "elephant", title: "Valle del elefante", note: "ice · cool grade", look: "ice" },
      { id: "spiral", title: "Espiral doble", note: "nocturne · green bloom", look: "nocturne" },
      { id: "filament", title: "Filamento fino", note: "ember fire · edge glow", look: "ember" },
      { id: "mini", title: "Mini-Mandelbrot", note: "rust · high contrast", look: "rust" },
      { id: "tendril", title: "Zarcillo oeste", note: "rust · tendril", look: "rust" },
      { id: "overview", title: "Vista clásica", note: "abyssal · establishing", look: "abyssal" },
    ];

    const gallery = document.getElementById("gallery");
    const strip = document.getElementById("strip");
    const heroImg = document.getElementById("hero-img");

    PIECES.forEach((p, i) => {
      const src = `styled/${p.id}.png`;

      const btn = document.createElement("button");
      btn.type = "button";
      btn.innerHTML = `<img src="${src}" alt="" loading="lazy" />`;
      if (i === 0) btn.classList.add("active");
      btn.addEventListener("click", () => {
        heroImg.src = src;
        strip.querySelectorAll("button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      strip.appendChild(btn);

      const article = document.createElement("article");
      article.className = "piece";
      article.dataset.look = p.look;
      article.innerHTML = `
        <div class="piece-frame" data-src="${src}" data-title="${p.title}">
          <img src="${src}" alt="${p.title}" loading="lazy" />
        </div>
        <div class="piece-meta">
          <h2 class="piece-title">${p.title}</h2>
          <span class="piece-note">${p.note}</span>
        </div>
      `;
      gallery.appendChild(article);
    });

    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) e.target.classList.add("in");
        });
      },
      { threshold: 0.18 }
    );
    document.querySelectorAll(".piece").forEach((el) => io.observe(el));

    const lb = document.getElementById("lightbox");
    const lbImg = document.getElementById("lb-img");
    const lbCap = document.getElementById("lb-cap");

    function openLb(src, title) {
      lbImg.src = src;
      lbCap.textContent = title;
      lb.hidden = false;
      requestAnimationFrame(() => lb.classList.add("open"));
    }

    function closeLb() {
      lb.classList.remove("open");
      setTimeout(() => { lb.hidden = true; lbImg.src = ""; }, 300);
    }

    gallery.addEventListener("click", (e) => {
      const frame = e.target.closest(".piece-frame");
      if (!frame) return;
      openLb(frame.dataset.src, frame.dataset.title);
    });

    document.getElementById("lb-close").addEventListener("click", closeLb);
    lb.addEventListener("click", (e) => { if (e.target === lb) closeLb(); });
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeLb();
    });
  </script>
</body>
</html>
